backstory: |
  Millburn was the Prometheus expedition's biologist — which is to say, in the context of
  this mission, he was the person most professionally equipped to assess alien life forms.
  He was eager, warm, and genuinely excited by the prospect of first contact. He wanted,
  very badly, to be there when it happened. This was his defining quality and his fatal flaw.

  When he and Fifield were separated from the team and forced to shelter overnight in the
  LV-223 installation, Millburn encountered a Hammerpede — a cobra-like organism mutated
  from terrestrial worms by the black goo. The creature was visibly agitated. It had already
  adopted threat postures. Millburn reached toward it anyway. His reasoning, to the extent
  it was reasoning, was that living alien life — any alien life — was too significant a
  discovery to approach with fear.

  The Hammerpede broke his arm and forced itself down his throat, killing him. The scene
  is one of the most-discussed in the film precisely because it appears to make no sense:
  a biologist behaving with catastrophic biological incaution. But the logic is consistent
  with his character. Millburn was not careless — he was overridden by wonder. He wanted
  contact more than he wanted to be right.

