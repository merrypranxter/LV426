    dynamic: |
      Millburn's approach to the Hammerpede is the scene the franchise never quite forgives
      or forgets. In-universe, it reads as the precise failure mode of scientific wonder
      without caution. As a narrative device, it kills the character most invested in what
      they came to find, before he can find any of it.

