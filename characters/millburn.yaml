  key_trait: |
    Millburn is the franchise's argument that wonder is not enough. He came to LV-223 for the
    right reasons — genuine curiosity, scientific passion, desire for contact — and was killed
    by the first contact he made. The black goo does not distinguish between good intentions
    and bad ones. Neither does the Hammerpede. The universe of the Alien franchise is not
    interested in why you came.

