# Iconic Scene
iconic_scene:
  name: "Andy's Sacrifice"
  timestamp: "01:45:00"
  film: "Alien: Romulus"
  description: |
    Andy, temporarily breaking through Rook's programming, uses the last of his own 
    autonomous control to protect Rain and destroy Rook's capacity to complete Special 
    Order 937. The scene cuts between Rain watching and Andy's face — the original Andy 
    visible in his expression for one last moment before the overwrite completes the 
    destruction of both personalities. Rain escapes because Andy chose her.
  significance: |
    Andy's sacrifice completes the franchise's meditation on synthetic loyalty begun with 
    Bishop. It also goes further: where Bishop was programmed to prioritise crew safety, 
    Andy chooses Rain over his own survival and over Rook's compulsion. The choice is not 
    programmed — it is the film's argument that Andy was, in whatever sense matters, a person.

# Connection to Franchise Continuity
continuity_links:
  nostromo_connection: |
    The Romulus station salvaged material from the USCSS Nostromo wreckage, including 
    xenomorph biological specimens and Ash's memory core. The xenomorphs Rain fights are 
    directly descended from the specimen Kane encountered in 2122.
  timeline_position: |
    Alien: Romulus is set in 2142 — twenty years after Alien (2122) and thirty-seven years 
    before Aliens (2179). Rain's story bridges the franchise's original horror and its 
    colonial marine expansion.
  pathogen_link: |
    The synthesised xenomorph pathogen Rain is exposed to connects to the Engineer black 
    goo experiments in Prometheus and Alien: Covenant — Weyland-Yutani has been developing 
    a weaponised version. Rain's resulting pregnancy with a hybrid organism is the direct 
    descendant of Shaw's trilobite and David's experiments.

# Symbolism
thematic_role:
  - "The next generation of Ripley — working-class, indentured, used by the corporation as an asset and an instrument"
  - "Class as horror: Jackson's Star is the franchise's most explicit depiction of Weyland-Yutani's labour exploitation"
  - "Her bond with Andy is the franchise's most developed human-synthetic relationship — built over a lifetime, not a mission"
  - "Her survival carries the franchise forward while explicitly connecting it to the original film's victims"
  - "The hybrid pregnancy: the continuation of David's work through institutional Weyland-Yutani research — horror as inheritance"

# Legacy
cultural_impact:
  - "Cailee Spaeny's performance is widely cited as the strongest element of Alien: Romulus"
  - "The Andy/Rook dynamic was praised for adding psychological depth to the franchise's android tradition"
  - "Rain's explicitly indentured status reignited discussion about the franchise's class politics"
  - "Alien: Romulus was the highest-grossing film in the franchise since Alien: Resurrection, in part due to Rain's audience connection"
  - "Rain is considered the most significant new Alien protagonist since Ripley by many franchise commentators"
