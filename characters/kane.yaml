# Relationships
key_relationships:
  - name: "Ash"
    relation: "unwitting subject"
    dynamic: |
      Ash overrides Ripley's quarantine specifically to protect Kane — and therefore the organism
      gestating inside him. To Ash, Kane is not a crewmate but a biological delivery system.
      Kane never learns this. His trust in the ship's Science Officer is absolute and fatal.
    see_also: /characters/ash.yaml

  - name: "Dallas"
    relation: "commanding officer"
    dynamic: "Dallas led the landing party and bore command responsibility for Kane entering the egg chamber; his subsequent deference to Ash over quarantine compounded the error."
    see_also: /characters/dallas.yaml

  - name: "Ellen Ripley"
    relation: "colleague; quarantine conflict"
    dynamic: |
      Ripley refused to allow Kane back aboard under standing quarantine protocol — a decision
      that was medically and procedurally correct. Ash overruled her. Kane's re-boarding,
      which Ripley explicitly opposed, is the franchise's founding act of institutional betrayal.
    see_also: /characters/ellen-ripley.yaml

# Character Traits
personality:
  surface_characteristics:
    - "Warm, approachable, and professionally confident"
    - "Voluntarily takes point on the most dangerous assignment — the derelict"
    - "Driven by curiosity; does not hesitate at the egg chamber threshold"

  defining_quality: |
    Kane's defining trait is an open, unguarded curiosity that functions as both his most human
    quality and his death warrant. He peers into the egg without calculation or fear. He is the
    crew member most fully alive in the film's first act — which makes his destruction the most
    viscerally affecting. His innocence is the mechanism of the horror.

# Defining Moment — The Chestburster
defining_moment:
  timestamp: "00:52:30"
  film: "Alien"
  description: |
    At the crew's dinner table, Kane convulses. The crew scrambles to hold him down. A xenomorph
    chestburster tears through his sternum and escapes into the ship. Kane is dead before anyone
    can react. The scene was filmed in a single take per actor; John Hurt's fellow cast members
    genuinely did not know the full extent of what was planned, and their shock responses are
    largely authentic. The chestburster was operated by puppeteers beneath the table. Blood and
    viscera were pumped outward under pressure. The sequence remains one of cinema's most iconic
    shock moments and the defining image of the Alien franchise's body-horror register.
  significance: |
    Kane's death is the franchise's original sacrifice — the moment that transforms Alien from
    a space-exploration thriller into a body-horror nightmare. It also establishes the xenomorph
    lifecycle in a single unforgettable image.

