# Biography
backstory: |
  Gilbert Ward Kane served as Executive Officer aboard the commercial towing vessel USCSS Nostromo,
  operating under Captain Dallas during a return haul from the Thedus mining operation. Affable,
  curious, and professionally capable, Kane was in every outward sense the least suspicious member
  of the crew — and that made him the ideal unwitting instrument of Weyland-Yutani's agenda.
  When the Nostromo was diverted to LV-426 by a covert company signal, Kane volunteered to lead
  the landing party into the derelict alien vessel. His curiosity — and Ash's deliberate failure
  to enforce quarantine protocol — sealed his fate. Kane became the first recorded human host for
  a xenomorph chestburster, his death igniting the chain of events that would consume the entire
  Nostromo crew. He never knew he was being used as a delivery vehicle for Weyland-Yutani's
  most prized biological acquisition.

