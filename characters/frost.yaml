backstory: |
  Trevor Frost was a Private in the Colonial Marines, assigned as an ammunition 
  carrier and general infantry for the LV-426 mission. He was the squad's most 
  junior supporting element — capable and present without a specialist role that 
  would individuate him further.

  His death is the film's first marine fatality in the initial engagement sequence, 
  caused by a chain reaction rather than direct xenomorph attack: Dietrich is grabbed 
  by a xenomorph, her flamethrower discharges uncontrolled, and the flame ignites 
  Frost's ammunition pack. He dies from the detonation. His death is the film's 
  first demonstration that the marines' own equipment and the enclosed environment 
  make them as dangerous to themselves as the xenomorphs are.

