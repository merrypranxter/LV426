backstory: |
  Mark Spunkmeyer was the crew chief of the UD-4L Cheyenne Dropship, working 
  with pilot Ferro. During the emergency extraction sequence, Spunkmeyer boards 
  the dropship first and discovers alien slime on the entry ramp — a warning sign 
  he does not have time to act on. He is killed by the xenomorph that had stowed 
  away in the ship before Ferro can be warned.

  His discovery of the slime — the moment he reports something is wrong and 
  is then cut off — is one of the film's most economical horror beats: the 
  audience understands before the characters do.

