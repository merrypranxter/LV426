backstory: |
  Colette Ferro was the Corporal pilot of the UD-4L Cheyenne Dropship deployed 
  from the USS Sulaco during the LV-426 mission. She executed the initial 
  atmospheric insertion that delivered the squad to the colony surface and remained 
  on standby for extraction.

  Her death — killed by a xenomorph that had stowed away in the dropship during 
  the extraction attempt — is the film's narrative turning point. With Ferro dead 
  and the pilotless dropship crashing into the colony, the marines lose their only 
  means of surface-to-orbit transit. The mission becomes a survival situation 
  with no exit.

