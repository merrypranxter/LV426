backstory: |
  Mark Drake was a Private and M56 Smart Gun operator in the Colonial Marines, 
  the operational partner to Vasquez in the squad's paired smart gun element. 
  He was direct and competent, individuated primarily through his partnership 
  with Vasquez and his smart gun role.

  Drake was shot and killed during the initial xenomorph contact engagement in 
  the alien processing plant — one of the squad's first combat losses after 
  the chain of casualties beginning with Frost. His death removes one of the 
  squad's two heavy weapons from the field.

