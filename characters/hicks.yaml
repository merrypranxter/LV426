# Iconic Scene
iconic_scene:
  name: "The Locator Bracelet"
  timestamp: "01:20:00"
  film: "Aliens"
  description: |
    In a quiet moment during the colony siege, Hicks fastens a locator bracelet to Ripley's 
    wrist, explaining it as a precaution so they can track each other. Neither character 
    elaborates on what the gesture means. The scene lasts under thirty seconds and contains 
    more emotional information than most declared love scenes in the franchise.
  significance: "The franchise's most compressed expression of human connection under extinction-level threat"

# Symbolism
thematic_role:
  - "Represents what the military could be — competent, humane, unbowed by machismo or corporate instruction"
  - "His leadership after Gorman's failure is the film's argument that authority should be earned, not ranked"
  - "The shotgun preference is the film's clearest character shorthand: close-range, personal, reliable"
  - "His death in Alien³ — off-screen, unceremonious, before the film begins — is the franchise's deliberate erasure of hope"
  - "The Hicks–Ripley partnership is the franchise's most credible depiction of mutual respect between a soldier and a civilian"

# Legacy
cultural_impact:
  - "Michael Biehn's performance is frequently cited alongside his work in The Terminator as defining the understated action hero"
  - "Hicks became a template for the competent, quiet soldier in ensemble sci-fi and action cinema"
  - "His elimination in Alien³ remains one of the most discussed retcon decisions in franchise filmmaking"
  - "The Hicks–Ripley relationship is consistently cited by viewers as the emotional throughline they most wanted continued"
  - "A version of Hicks was reinstated in the canonical Alien 3 comic series, reflecting sustained audience refusal to accept his death"
