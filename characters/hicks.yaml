# Biography
backstory: |
  Dwayne Hicks was a Corporal in the United States Colonial Marine Corps, assigned to the 
  USS Sulaco under Lieutenant Gorman. He was a quiet, competent soldier — unshowy in a unit 
  that favoured volume and aggression. Where Hudson performed bravado and Vasquez performed 
  invincibility, Hicks simply did the work. His preference for a pump-action shotgun in an 
  era of smart rifles and pulse weapons was not nostalgia; it was philosophy — close-range, 
  reliable, personal, no margin for error.

  When Gorman's catastrophic mismanagement of the first contact scenario incapacitated the 
  lieutenant and gutted the squad, Hicks assumed command without drama. He became the de 
  facto leader not through rank but through being the only person in the room operating 
  with full clarity. His professionalism and genuine care for the civilians — Ripley and Newt 
  — distinguished him from every other soldier in the unit.

# Film-by-Film Arc
timeline:
