# Relationships
key_relationships:
  - name: "Ellen Ripley"
    relation: "partner_and_emergent_equal"
    dynamic: |
      Hicks and Ripley develop one of science fiction cinema's most understated partnerships. 
      Neither is subordinate to the other — Ripley has expertise in the threat, Hicks has 
      expertise in the response. They operate as equals from the moment Gorman fails. The 
      locator bracelet exchange — "it's just a precaution" — functions as the franchise's 
      most restrained love scene: two people who understand they may not survive, extending 
      each other a thread of connection. His death in Alien³, like Newt's, lands as a 
      deliberate cancellation of everything Aliens built.
    pivotal_moment: "Hicks fastens the locator bracelet to Ripley's wrist; neither says what it means"

  - name: "Newt"
    relation: "protective_adult"
    dynamic: |
      Hicks treats Newt as a person with full credibility — takes her knowledge of the colony 
      layout seriously, speaks to her directly, and maintains the same steady calm around her 
      as he does with everyone. He never performs protectiveness; he simply enacts it.

  - name: "Hudson"
    relation: "counterpoint_colleague"
    dynamic: |
      Hudson is the unit's voice of panic and noise; Hicks is its stillness. They are not 
      opposed but complementary — Hudson's volatility makes Hicks's steadiness more visible. 
      When Hudson breaks, Hicks absorbs the pressure without comment.

  - name: "Bishop"
    relation: "professional_trust"
    dynamic: "Hicks endorses Bishop's risky solo conduit mission without hesitation; extends trust based on demonstrated competence"

# Character Traits
personality:
  strengths:
    - "Quiet competence under catastrophic pressure"
    - "Decisive leadership without ego"
    - "Genuine empathy for civilians without condescension"
    - "Economy of action — does exactly what is needed, nothing performative"
    - "Reliable judgment when everyone else is operating on fear"

  key_trait: |
    The shotgun is the key to Hicks. In a film full of smart weapons and high-tech ordnance, 
    Hicks keeps a pump-action shotgun. The choice encodes his entire character: close range, 
    immediate, no reliance on systems that can fail. He does not prepare for distance or 
    abstraction — he prepares to be there, present, when it matters.

  evolution: "Background soldier → moral centre of the military unit → the franchise's most mourned loss"

