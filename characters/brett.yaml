# Symbolism
thematic_role:
  - "Brett's death confirms the xenomorph as a lethal adult predator — the film's point of no return"
  - "Establishes the xenomorph's ambush hunting behavior: patience, elevation, single decisive strike"
  - "His passivity makes him the perfect first victim — he has never once imposed his own will on events"
  - "The cat-chasing irony is the film's darkest joke: Brett is killed doing the most innocent errand"
  - "His and Parker's pairing represents labor solidarity — and the franchise's argument that the corporation treats both equally as expendable"

# Legacy
cultural_impact:
  - "Harry Dean Stanton's effortlessly naturalistic performance made Brett one of the most memorable minor characters in the franchise despite his limited screen time"
  - "The equipment bay death scene is a masterclass in tension-through-environment; widely studied in horror filmmaking"
  - "Brett's 'Right' verbal tic has been referenced and parodied across decades of Alien fandom"
  - "His death remains the franchise's clearest first demonstration of the adult xenomorph's hunting method"
