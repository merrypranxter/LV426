# Biography
backstory: |
  Samuel Brett served as Engineering Technician aboard the USCSS Nostromo, working under Chief
  Engineer Parker in the vessel's lower decks. Brett was the quietest and most passive member
  of the crew — a man of easy agreement and few ambitions, content to follow Parker's lead,
  maintain his assigned systems, and collect his share at the end of the run. His defining
  verbal habit — agreeing with virtually everything Parker said, often with a flat "right" —
  positioned him as the passive wing of the engineering duo. Brett was not unintelligent; he
  chose, consistently, the path of least resistance. This made him the perfect companion for
  Parker's more assertive temperament, and it made him the Nostromo's most vulnerable crew
  member when the organism was loose in the ship. Brett died alone in the equipment storage bay,
  chasing Jones the ship's cat, killed from above by a xenomorph that had grown to adult size
  in an unknown number of hours. His death was the crew's proof of concept: the facehugger's
  passenger had become something that could hunt them.

