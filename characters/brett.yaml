# Relationships
key_relationships:
  - name: "Parker"
    relation: "engineering partner; his only real alliance"
    dynamic: |
      Brett was Parker's passive counterpart — the "right" to every Parker assertion. Their
      partnership was unequal but stable: Parker provided energy and complaint, Brett provided
      compliance and steady company. Brett's death hits Parker harder than anything else in
      the film. His grief is immediate and genuine, and it drives the recklessness that
      eventually gets Parker killed too.
    see_also: /characters/parker.yaml

  - name: "Jones (the cat)"
    relation: "pursuer; instrument of his death"
    dynamic: |
      Brett died chasing Jones through the ship's lower corridors. The irony is almost
      unbearable: the ship's cat, the most harmless creature aboard the Nostromo, led the
      most agreeable crew member into the only compartment where the xenomorph was waiting.
      Jones survived. Brett did not. The cat's survival across the film has been read as
      darkly comic and as a pointed comment on passive bystanders.

  - name: "Ellen Ripley"
    relation: "peripheral colleague"
    dynamic: "Brett existed largely outside the command structure that Ripley operated within; their interactions are minimal, defined mainly by the shared crisis."
    see_also: /characters/ellen-ripley.yaml

# Character Traits
personality:
  surface_characteristics:
    - "Mild, agreeable, and habitually passive"
    - "Follows Parker's lead without friction or ambition"
    - "Competent in his technical role; no evident desire for more"

  defining_habit: |
    Brett's signature is his monosyllabic agreement — he says some variant of "right" to
    virtually every statement Parker makes, regardless of content. It functions as both a
    character tag and a thematic statement: Brett is a man who has outsourced his opinions.
    In a film about individuals who fail because they defer to authority (Dallas to Ash,
    Ash to the company), Brett is the most extreme case — a man who defers to everyone
    and everything, including the xenomorph that drops on him from above.

  on_passivity: |
    Brett's passivity is not stupidity — it is a disposition. He chose the engineering
    section of a commercial freighter because it does not demand more than technical
    competence and compliance. In the normal run of a Nostromo voyage, this would have
    been entirely adequate. The film is, in part, about a universe where adequate is
    not enough — and where the most dangerous thing you can do is be alone with
    something that has not yet been named.

# Defining Moment — The Equipment Bay
defining_moment:
  timestamp: "01:04:15"
  film: "Alien"
  description: |
    Brett finds Jones in the equipment storage bay. He calls to the cat, which backs away
    from something behind him. Water drips from the ceiling in a regular mechanical rhythm.
    Brett looks up. The xenomorph drops. The scene is almost unbearably tense because
    it builds entirely through environment — the dripping water, the cat's reaction,
    the inhuman patience of the thing above — before resolving in a single, fast cut.
    Brett's death is the film's confirmation that the creature has become something
    capable of systematic predation. Everything after this scene is a hunt.
  significance: |
    Brett's death shifts the film's register from mystery-horror to predator-thriller.
    Before this scene, the xenomorph is largely unseen threat. After it, the crew know
    exactly what they are dealing with, and they have no idea how to survive it.

