# Relationships
key_relationships:
  - name: "Ellen Ripley"
    relation: "authority conflict"
    dynamic: |
      Ripley was the only crew member who consistently made the correct call — enforce quarantine,
      distrust Ash, refuse to split up. Dallas outranked her and overrode her at every turn.
      His deference to chain of command over sound judgment is the franchise's original sin.
      By the time he dies, Ripley's competence has already made his authority hollow.
    see_also: /characters/ellen-ripley.yaml

  - name: "Ash"
    relation: "trusted colleague; fatal misplaced trust"
    dynamic: |
      Dallas trusted Ash completely, treating him as a competent Science Officer rather than the
      Weyland-Yutani plant he was. When Dallas overruled Ripley's quarantine, he was acting on
      Ash's recommendation. He never knew he was being managed.
    see_also: /characters/ash.yaml

  - name: "Lambert"
    relation: "closest crew bond"
    dynamic: "Lambert and Dallas shared the warmest working relationship aboard the Nostromo; his death is the moment her composure finally collapses entirely."
    see_also: /characters/lambert.yaml

  - name: "Kane"
    relation: "subordinate officer; shared command responsibility"
    dynamic: "Dallas led the landing party that put Kane in the egg chamber; his decision to re-board Kane bypassed the last safeguard that might have contained the organism."
    see_also: /characters/kane.yaml

# Character Traits
personality:
  surface_characteristics:
    - "Authoritative and calm under routine conditions"
    - "Pragmatic and direct; minimal sentiment"
    - "Trusts hierarchy and established chain of command"

  fatal_flaw: |
    Dallas's fatal flaw is institutional deference — a captain's habit of trusting the systems
    around him. He trusts Mother. He trusts Ash. He trusts the company's implicit promise that
    the mission is what it appears to be. Every time he overrules Ripley, he is choosing the
    institution over the individual. The Alien franchise argues, consistently, that this is
    exactly the wrong choice.

# Defining Moment — The Duct Hunt
defining_moment:
  timestamp: "01:15:20"
  film: "Alien"
  description: |
    Dallas enters the Nostromo's ventilation system alone, armed with a flamethrower, guided
    by Lambert's tracker readings. The sequence is a masterclass in sustained dread: we hear
    only his breathing and Lambert's increasingly panicked direction. The xenomorph is always
    one junction away. Then it is not. Dallas screams. The tracker dot vanishes. He is gone
    before the audience can process it. In the Director's Cut, Ripley later finds him cocooned
    to the ship's inner hull — alive, partially transformed, begging her to end it.
  directors_cut_note: |
    The cocooning scene was cut from the 1979 theatrical release at Ridley Scott's discretion,
    restored in the 2003 Director's Cut. It dramatically expands Dallas's fate and foreshadows
    the xenomorph's use of human hosts revealed more fully in later films.

