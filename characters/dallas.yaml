# Biography
backstory: |
  Arthur Kapp Dallas was the commanding officer of the USCSS Nostromo, a Class M-class star
  freighter under contract to the Weyland-Yutani Corporation. A seasoned deep-space hauler,
  Dallas was practical, laconic, and accustomed to the grinding routine of commercial spaceflight.
  He trusted the company's systems and, fatally, the company's android. When the Nostromo
  intercepted a transmission on LV-426 and Mother routed the ship to investigate, Dallas had no
  reason to suspect the diversion was engineered. He made a series of decisions — allowing Kane
  back aboard against quarantine, authorizing the hunt through the ventilation ducts himself —
  that were understandable in the moment and catastrophic in consequence. Dallas was not
  a coward or a fool; he was a competent captain operating without the information he needed
  because the company deliberately withheld it from him. He died in the ducts, hunting a
  creature he could not outmaneuver, alone in the dark.

