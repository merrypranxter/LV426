# Symbolism
thematic_role:
  - "The authority figure whose flawed judgment seals everyone's fate"
  - "Failure to back Ripley's quarantine decision is the franchise's original institutional sin"
  - "Represents competent, well-meaning leadership rendered lethal by corporate information suppression"
  - "His death transfers command authority to Ripley — the franchise's true protagonist — by elimination"
  - "The duct hunt sequence is a template for every 'hunting the hunter' horror sequence that followed"

# Legacy
cultural_impact:
  - "Tom Skerritt's understated performance established the 'reluctant authority' archetype in sci-fi horror"
  - "Dallas's death in the ducts subverted 1970s audience expectations — the apparent male lead is not the survivor"
  - "The Director's Cut cocooning scene recontextualised his fate and influenced the franchise's subsequent lore on xenomorph host behavior"
