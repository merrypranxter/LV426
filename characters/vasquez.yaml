backstory: |
  Jenette Vasquez was a Private and smart gun operator in the Colonial Marines, 
  one of two M56 operators in the LV-426 squad alongside Drake. She was physically 
  powerful, tactically aggressive, and unimpressed by any performance of authority 
  that wasn't backed by demonstrated competence.

  Vasquez occupies a complex position in the franchise's character landscape. 
  She reads, at first glance, as a stock tough-soldier archetype. She is also 
  one of the film's most consistently correct actors — she is right about Gorman, 
  right about the threat level, right about what needs to be done. Her death — 
  choosing to detonate a grenade with Gorman when escape is impossible — is one 
  of the franchise's most economical acts of mutual sacrifice.

