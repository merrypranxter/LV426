key_relationships:
  - name: "Drake"
    relation: "smart_gun_partner"
    dynamic: |
      Drake is Vasquez's operational partner — they operate the two M56 smart guns 
      as a coordinated pair. His death is the film's first indication that Vasquez 
      can be hurt, though she does not perform grief.

  - name: "Gorman"
    relation: "contempt_transformed_to_respect"
    dynamic: |
      Vasquez has no use for Gorman's authority from the beginning — she sees 
      through rank to incompetence. His redemption comes when he chooses to stay 
      behind with her in the final corridor rather than retreat. She dies with him 
      not despite her contempt but because, in the end, he earned her respect.

  - name: "Hudson"
    relation: "antagonistic_peer"
    dynamic: |
      Hudson and Vasquez maintain a constant competitive friction — he performs 
      toughness; she embodies it. Their antagonism is the film's comedic undercurrent 
      and also its gender commentary: Vasquez's masculinity is not performed but 
      functional, which makes Hudson's performance look like exactly what it is.

