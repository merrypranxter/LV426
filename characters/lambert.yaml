# Symbolism
thematic_role:
  - "Embodies unfiltered human terror — the most honest emotional register in the film"
  - "Her consistent advocacy for evacuation makes the crew's death feel preventable and therefore tragic"
  - "Her off-screen death maximizes horror through implication; the imagination supplies worse than any image"
  - "The slap scene frames the central Alien tension: procedural correctness versus human empathy"
  - "Lambert is the film's emotional truth-teller — dismissed, sidelined, and ultimately vindicated by dying exactly as she predicted"

# Legacy
cultural_impact:
  - "Veronica Cartwright's performance is a benchmark for realistic terror in science fiction"
  - "Lambert's death — mostly off-screen, heard rather than seen — influenced how subsequent Alien films use implication over depiction"
  - "The character's 'hysterical woman' surface reading has been extensively re-evaluated; contemporary critics largely read her as the crew's most accurate threat-assessor"
