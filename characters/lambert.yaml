# Biography
backstory: |
  Joan Marie Lambert served as Navigator aboard the USCSS Nostromo, responsible for plotting
  the vessel's course and managing navigational systems throughout its deep-space haul. Lambert
  was technically skilled and professionally composed under normal conditions — but the Nostromo's
  final voyage was not normal. From the moment the crew was routed to LV-426, Lambert's responses
  tracked the horror honestly and without filter. She was afraid from the beginning. She got more
  afraid as things got worse. She said so, loudly, at every stage. Where other crew members
  compartmentalized or performed calm, Lambert did not. This made her, to some viewers,
  the most irritating crew member aboard the Nostromo. It made her, on reflection, the most
  human. Lambert descended to the derelict, tracked the xenomorph through the ship's corridors,
  pleaded for evacuation when it was still possible, and died during a fuel transfer sequence
  — alone with Parker, the xenomorph between them.

# Film-by-Film Arc
timeline:
  - film: "Alien"
    year: 2122
    role: "Navigator; tracker; the crew's emotional barometer"
    key_moments:
      - "Plots the course diversion to LV-426; first to understand the distress signal's coordinates"
      - "Descends to the derelict alien ship as part of the landing party with Dallas and Kane"
      - "Slaps Ripley when Ripley refuses to re-board Kane under quarantine — one of the film's most charged moments"
      - "Operates the motion tracker during the duct hunt; her mounting panic as Dallas is killed is harrowing"
      - "Argues repeatedly for immediate crew evacuation — the correct tactical call, ignored each time"
