    character_state: "Frightened throughout and correct to be; her panic is the film's most honest emotional performance"

# Relationships
key_relationships:
  - name: "Dallas"
    relation: "closest crew bond"
    dynamic: |
      Dallas and Lambert shared the most openly warm relationship aboard the Nostromo. His death
      in the ventilation ducts is the moment Lambert's remaining composure dissolves. She cannot
      stop crying at the tracker after his signal disappears. Her grief is unperformed and total.
    see_also: /characters/dallas.yaml

  - name: "Parker"
    relation: "colleague; died trying to save her"
    dynamic: |
      Parker and Lambert were not particularly close during the voyage, but their deaths are
      paired: Parker is killed first while trying to flame the xenomorph away from Lambert;
      Lambert dies moments later. Parker's sacrifice for her — impulsive, fatal — is one of
      the film's few gestures of pure unambiguous heroism.
    see_also: /characters/parker.yaml

  - name: "Ellen Ripley"
    relation: "tension; conflicting approaches to fear"
    dynamic: |
      Lambert and Ripley clash because they process fear opposite ways. Lambert externalizes
      terror and demands immediate emotional acknowledgment; Ripley suppresses it and focuses
      on procedure. Lambert slaps Ripley over the Kane quarantine decision. Ripley never hates
      her for it — but the two women are never warm. Both are right, in different ways,
      about different things.
    see_also: /characters/ellen-ripley.yaml

  - name: "Kane"
    relation: "fellow landing party member"
    dynamic: "Lambert was present at the derelict when the facehugger took Kane; she helped carry him back to the Nostromo."
    see_also: /characters/kane.yaml

# Character Traits
personality:
  surface_characteristics:
    - "Technically competent; professionally reliable under routine conditions"
    - "Emotionally transparent — does not mask fear or grief"
    - "Vocal about danger; consistently advocates for the safest available option"

  key_trait: |
    Lambert's defining characteristic is unfiltered honesty about her own terror. In a genre
    full of characters who suppress fear to project competence, she refuses. She is not
    incapacitated by fear — she continues to function, track, plot, and argue — but she will
    not pretend she is calm when she is not. This makes her the most emotionally realistic
    crew member in the film, and the one whose fate audiences feel most viscerally.

  on_fear: |
    Lambert is often misread as weak. She is not. She is scared, accurately. Every course of
    action she advocates — immediate evacuation, not splitting up, not going into the ducts —
    is tactically correct. The crew who dismiss her as panicking are the crew who die in the
    order she predicted they would. Her fear is the film's most reliable intelligence source.

# Defining Moment — The Tracker After Dallas
defining_moment:
  timestamp: "01:17:45"
  film: "Alien"
  description: |
    Lambert is monitoring the motion tracker as Dallas moves through the ventilation ducts.
    She is relaying his position in a voice that has been tightening for minutes. Then the
    signal stops moving. Then it is gone. Lambert does not speak for several seconds.
    Then she begins to cry, quietly, over the radio. The scene contains no jump scare,
    no monster reveal — only Lambert's face and the blank tracker screen. It is the film's
    most purely desolate moment.
  significance: "Establishes the horror through emotional response rather than on-screen violence; Lambert's grief does more work than any practical effect"

