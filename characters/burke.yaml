# Biography
backstory: |
  Carter J. Burke was a mid-level Weyland-Yutani corporate representative assigned to 
  manage the company's relationship with the LV-426 terraforming operation at Hadley's Hope. 
  He was the company contact who, acting on the coordinates recovered from Ripley's flight 
  recorder after the Nostromo incident, directed Russ Jordan and the colonists to investigate 
  the derelict alien spacecraft — without disclosing what they might find. That order set in 
  motion the infestation that killed all 158 residents of Hadley's Hope.

  Burke subsequently recruited Ellen Ripley for the marines' investigation mission, presenting 
  himself as her advocate with the company and the board that had stripped her pilot's licence. 
  He arranged her reinstatement and passage to LV-426, framing his involvement as concern for 
  her welfare. His actual purpose was to use the mission to acquire xenomorph specimens for 
  Weyland-Yutani's bioweapons division — using Ripley and the colonists as delivery vehicles.

