# Relationships
key_relationships:
  - name: "Ellen Ripley"
    relation: "false_ally"
    dynamic: |
      Burke presents as Ripley's champion — the one person in the company who believed her, 
      fought for her reinstatement, included her in the mission. This is precisely calibrated: 
      he needs her expertise and her silence, and presenting as her advocate is the most 
      efficient way to secure both. When Ripley exposes him, she delivers the franchise's 
      clearest anti-corporate statement: "I don't know which species is worse. You don't see 
      them fucking each other over for a goddamn percentage." Burke's response is to remain 
      plausible for as long as possible. He is her most immediate human enemy and the film's 
      most direct argument that the real monster wears a company badge.
    pivotal_moment: "Ripley finds the facehugger tanks open and the medical bay door locked from outside"

  - name: "Newt"
    relation: "collateral_asset"
    dynamic: |
      Burke's order to investigate the derelict killed Newt's parents and destroyed everyone 
      she knew. He then attempted to use Newt as a xenomorph host in the medical bay. Burke 
      does not register her as a child — she is a resource problem and then a potential 
      delivery vehicle. The full dimension of his culpability passes through her: he is not 
      merely a corporate villain but the man who orphaned her twice.

  - name: "Anne & Russ Jordan"
    relation: "directed_to_their_deaths"
    dynamic: "Burke transmitted the derelict coordinates to Russ Jordan without disclosure; his order triggered the infestation that killed 158 people"

  - name: "Weyland-Yutani Corporation"
    relation: "instrument_and_embodiment"
    dynamic: |
      Burke is the corporation made flesh — not its exceptional excess but its ordinary 
      function. He is plausibly deniable, commercially motivated, and capable of atrocity 
      framed as business necessity. He does not see himself as evil; he sees himself as 
      pragmatic. This is the film's most important insight about institutional violence: 
      it does not require monsters, only employees doing their jobs within acceptable margins.

# Character Traits
personality:
  surface_presentation:
    - "Affable, approachable, advocate-facing"
    - "Uses first names immediately; projects warmth and informality"
    - "Frames catastrophically harmful decisions in the language of pragmatism and opportunity"
    - "Maintains plausibility under pressure longer than is plausible"

  true_nature: |
    Burke is purely transactional. Every relationship is a resource management question; 
    every human life is an asset or a liability on a balance sheet he is always running. 
    He is capable of ordering or enabling mass death while smiling and using the language 
    of concern and regret. He is not sadistic — sadism would require him to care about 
    suffering. He simply does not register it as primary data.

  key_trait: |
    The most dangerous thing about Burke is that he sounds reasonable. When confronted 
    with the facehugger incident, his first move is minimal accountability: "I made a 
    judgment call. It was a bad call." He does not deny, does not confess — he scales 
    the language of the admission to the minimum that might preserve credibility. This 
    is the grammar of institutional evil, and Burke speaks it natively.

