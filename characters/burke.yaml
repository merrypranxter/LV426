# Ripley's Verdict
ripley_condemnation:
  film: "Aliens"
  line: "I don't know which species is worse. You don't see them fucking each other over for a goddamn percentage."
  context: |
    Ripley, after exposing Burke to the squad, delivers the franchise's most direct 
    anti-corporate statement. The line reframes the entire film: Burke is not a human 
    being who went wrong, he is the system's correct output. The xenomorphs kill because 
    they are designed to propagate; Burke kills because the incentive structure rewards it. 
    The species comparison is the film's thesis.

# Iconic Scene
iconic_scene:
  name: "The Medical Bay"
  timestamp: "01:25:00"
  film: "Aliens"
  description: |
    Burke releases two facehuggers into the sealed medical bay where Ripley and Newt are 
    sleeping, then locks the door from outside. His plan: the women are impregnated, the 
    embryos survive the return to Earth inside hosts, the specimens pass bioscan because 
    no one will be checking the humans. The plan is elegant in its corporate logic — 
    minimal exposure, maximum yield, full deniability. Ripley wakes to a facehugger on 
    Newt's face and dismantles it with a cigarette lighter and an automated fire suppression 
    system that she triggers deliberately.
  significance: "The moment the film's human villain becomes fully visible; Burke's method is as cold and systematic as the corporation he serves"

# Symbolism
thematic_role:
  - "The banality of corporate evil made literal — not a monster, just a man in a polo shirt making business decisions"
  - "Burke is the franchise's answer to Ash: Ash was a machine programmed to serve the company; Burke is a human who chose to"
  - "His death by xenomorphs is the film's moral engine completing its cycle — the man who weaponised the creatures is consumed by them"
  - "Represents what Weyland-Yutani actually is beneath its institutional language: an engine for converting human lives into shareholder value"
  - "The most mundane monster in the franchise — and therefore the most honest about where the real threat originates"

