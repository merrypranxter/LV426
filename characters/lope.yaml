backstory: |
  Lope was the security chief aboard the USCSS Covenant — the operational authority responsible
  for the crew's physical safety on an interstellar colonisation mission carrying over two
  thousand colonists in hypersleep. He was professional, measured, and experienced. His husband
  Hallett was among the first crew members to die on Planet 4, killed in the initial neomorph
  attack. Lope continued to function after this loss with the discipline of someone who knows
  that falling apart is not an option when others depend on him.

  He was one of the crew members who survived the encounter with David on Planet 4 and made
  it back to the Covenant. In the film's final act, it is revealed — in a quiet, devastating
  moment — that Lope was implanted with a facehugger embryo during David's manipulation of
  the rescue operation. Whether the embryo is removed or kills him is not shown. The film
  ends before it becomes explicit. The implication is sufficient.

  Lope's arc gives the Alien: Covenant ensemble its clearest human cost. His relationship
  with Hallett establishes that the Covenant crew were not just professionals on a corporate
  mission — they were people with lives, partnerships, futures. David's experiments took that
  from Lope twice: first his husband, then his own survival.

