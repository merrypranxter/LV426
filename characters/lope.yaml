key_relationships:
  - name: "Hallett"
    relation: "husband"
    dynamic: |
      Hallett's death is Lope's wound. The film establishes their relationship efficiently —
      enough for his loss to register as loss, not just as a crew casualty number. Lope does
      not collapse; he absorbs it and keeps moving. This is not numbness — it is the specific
      grief of someone who has decided that falling apart is a luxury he cannot afford.
    pivotal_moment: "Hallett's death from neomorph emergence; Lope witnesses it and cannot stop it"

  - name: "David"
    relation: "unknowing_victim"
    dynamic: |
      David implants Lope with a facehugger embryo without his knowledge during the chaos
      of the crew's rescue from Planet 4. Lope has no reason to suspect David — the android
      appears to have saved them. The horror of Lope's situation is that he trusts the thing
      that has already killed him.

  - name: "Daniels"
    relation: "fellow_survivor"
    dynamic: |
      Lope and Daniels are among the Covenant's most capable surviving crew members.
      Their shared competence and shared loss give them a functional solidarity in the film's
      second half.

