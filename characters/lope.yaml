  key_trait: |
    Lope is the Covenant crew's most complete portrait of the personal cost of the mission.
    His security role puts him at the front of every crisis; his marriage to Hallett gives him
    something to lose. He loses it. He keeps going. And then, in the film's final quiet horror,
    he loses himself — without ever knowing it.

  evolution: "Competent security chief → bereaved husband → unknowing host"

thematic_role:
