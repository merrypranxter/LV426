    - "Physical fitness and self-reliance — maintains her own survival equipment"

  key_trait: |
    Vickers is the franchise's corporate overseer archetype in its most fully humanised form.
    Where Carter Burke (Aliens) is a weasel, Vickers is a professional. She is not dishonest —
    she simply operates in a framework where human life is a mission variable. Her tragedy
    is that she is genuinely competent at the wrong job, running a mission whose true purpose
    was concealed from her by the man she was sent to serve.

  evolution: "Corporate authority figure → revealed heir → casualty of her own miscalculation"

