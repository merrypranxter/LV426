key_relationships:
  - name: "Peter Weyland"
    relation: "implied_daughter"
    dynamic: |
      The film never states outright that Vickers is Weyland's daughter, but David's pointed
      comment about kings and their reigns — delivered directly to her — plants the reading
      clearly. Her confrontation with Weyland is the franchise's starkest depiction of corporate
      succession anxiety: a daughter who has prepared her entire life to inherit a company,
      sidelined by a father who would rather spend that inheritance on his own immortality.
    pivotal_moment: "Weyland's dismissal of Vickers during the confrontation scene — he looks through her"

  - name: "David 8"
    relation: "adversarial_distrust"
    dynamic: |
      Vickers and David circle each other throughout the film with open mutual contempt.
      She sees him as an extension of Weyland's delusion; he sees her as an obstacle to
      Weyland's mission. David's provocations are precisely calibrated to destabilise her,
      and she responds with threats rather than authority — a signal that she knows she lacks
      true leverage over him.

  - name: "Captain Janek"
    relation: "uneasy_colleagues"
    dynamic: |
      Janek and Vickers occupy opposite ends of the ship's human hierarchy — she is corporate
      authority, he is operational competence. Their brief sexual encounter is the film's
      most humanising moment for Vickers; she initiates, which reads as either control or
      vulnerability, possibly both.

  - name: "Elizabeth Shaw"
    relation: "mission_friction"
    dynamic: |
      Vickers views Shaw's idealistic motivations with contempt and regards her independent
      actions as insubordination. Shaw uses Vickers's own Med Pod against her implicit
      ownership — one of the film's small structural ironies.

personality:
  strengths:
    - "Absolute command presence; authority is never performative, always structural"
    - "Competent crisis management when dealing with human variables"
