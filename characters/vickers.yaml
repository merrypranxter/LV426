backstory: |
  Meredith Vickers was the Weyland Corporation's official overseer aboard the USCSS Prometheus,
  sent to ensure the company's interests were protected on a trillion-dollar deep-space mission.
  Cold, supremely competent, and operating entirely within the logic of corporate authority,
  Vickers regarded the Prometheus mission as a liability to be managed rather than a discovery
  to be made. Her relationship with the crew was transactional; her relationship with David was
  openly antagonistic. She saw the android as a projection of Peter Weyland's ego and treated
  him accordingly.

  The film implies — through David's deliberate provocation ("A king has his reign, and then
  he dies. It's inevitable.") — that Vickers is Peter Weyland's daughter, though she neither
  confirms nor denies it. If true, her position is paradoxical: the heir apparent placed in
  command of a mission whose actual purpose is to extend her father's life indefinitely, cutting
  her out of any inheritance. She confronts Weyland directly about this dynamic in the film's
  third act, and his dismissal of her confirms the reading.

  Vickers maintained a private lifeboat pod aboard the Prometheus equipped with a sophisticated
  Med Pod — standard for Weyland executives, and a detail that becomes critical when Elizabeth
  Shaw uses the pod for emergency surgery to remove a proto-facehugger organism. Vickers dies
  on the surface of LV-223 when the crashing Engineer juggernaut rolls toward her; she runs
  parallel to its direction of travel rather than perpendicular, and is crushed. The death is
  abrupt and unglamorous — a fitting end for a character who always believed she was prepared
  for every contingency.

