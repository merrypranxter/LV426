# Biography
backstory: |
  Tennessee Faris was the chief pilot of the USCSS Covenant, the best in the fleet at 
  reading a ship and keeping it alive. His surname Faris is shared with his wife — the 
  two are married, and both crew members appear in ship records under the Faris name. 
  He was married to fellow crew member Maggie Faris, who served as a Covenant pilot on 
  the away team's dropship. Tennessee's combination of 
  technical excellence, emotional directness, and loyalty to his people defined him. He 
  had no ideological agenda — no faith to test, no ambition to validate. He wanted the 
  mission to succeed, he wanted his wife to come home, and when that second thing became 
  impossible, he did everything in his power to make the first thing mean something. 
  He wore a cowboy hat.

# Film-by-Film Arc
timeline:
  - film: "Alien: Covenant"
    year: 2104
    role: "Chief Pilot; rescue anchor; final xenomorph kill"
    key_moments:
      - "Pilots the Covenant through the neutrino burst that kills Captain Branson"
      - "Remains aboard the Covenant during the away team's initial descent"
      - "Loses his wife Maggie when the contaminated dropship explodes — she was piloting it to safety after a crew member's spore infection triggered a neomorph birth"
      - "Defies Weyland-Yutani protocols and Captain Oram's orders to manoeuvre the Covenant into rescue range"
      - "Successfully extracts surviving crew members from the surface using the Covenant's lander"
      - "Coordinates with Daniels during the xenomorph boarding event in the Covenant's cargo bay"
      - "Operates the Covenant's landing crane in the climactic sequence; swings the crane to throw the xenomorph into the engine intake"
      - "Works with Daniels to complete the kill — she rides the crane platform"
