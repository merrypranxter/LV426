# Iconic Scene
iconic_scene:
  name: "The Crane Kill"
  timestamp: "01:48:00"
  film: "Alien: Covenant"
  description: |
    Tennessee manoeuvres the Covenant's enormous landing crane while Daniels stands on the 
    platform above the cargo bay where a xenomorph is hunting. He swings the crane arm to 
    give Daniels a weapon and then a trajectory — ultimately launching the creature into the 
    ship's engine intake. The sequence is the film's cleanest action beat: two people, 
    one machine, one monster, no ambiguity.
  significance: |
    After a film defined by manipulation, deception, and the horror of not knowing who to 
    trust, the crane kill is a moment of pure direct action. Tennessee and Daniels trust 
    each other completely. The xenomorph dies. It does not solve anything — David is still 
    aboard — but it is the film's most satisfying beat.

