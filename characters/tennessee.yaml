      - "Is now in cryo alongside Daniels with David masquerading as Walter"
    character_state: |
      Loses his wife and responds not with paralysis but with focused, purposeful action. 
      Tennessee is the film's moral constant — he does not calculate consequences, he 
      responds to what is right. His grief is real and does not disappear; it just does 
      not stop him.

# Relationships
key_relationships:
  - name: "Maggie Faris"
    relation: "wife (deceased)"
    dynamic: |
      Maggie was Tennessee's anchor — his reason for being on the mission beyond professional 
      duty. When she died piloting the contaminated dropship, Tennessee's grief was immediate 
      and total. His rescue mission — defying orders to manoeuvre the Covenant into range — 
      was his response to that grief. He could not save Maggie; he would save everyone else.
    pivotal_moment: "Watching the dropship explode from the Covenant bridge; the moment Tennessee's story changes"

  - name: "Daniels"
    relation: "ally; fellow survivor in grief"
    dynamic: |
      Tennessee and Daniels were both widowed by the mission within hours of each other. 
      Their alliance is built on shared loss and shared competence. Neither has time to 
      process the grief; both act anyway. They coordinate the final xenomorph kill as a 
      unit — her on the crane platform, him at the controls. It is the film's one moment 
      of uncomplicated human cooperation.
    pivotal_moment: "The crane sequence — Tennessee operates, Daniels fights, they destroy the xenomorph together"

  - name: "Walter"
    relation: "trusted crew member (later revealed to be David)"
    dynamic: |
      Tennessee trusted Walter as a competent and loyal synthetic. He had no reason to 
      suspect the switch. He is now in cryo, oblivious to David's presence aboard. 
      His obliviousness is the franchise's final cruelty — he survived everything the 
      mission threw at him only to sleep through its worst betrayal.

  - name: "Captain Oram"
    relation: "professional tension; followed orders despite disagreement"
    dynamic: |
      Tennessee disagreed with Oram's decisions but operated within the command structure 
      — until Maggie died, at which point he chose loyalty to crew over protocol. 
      His defiance of Oram's orders to stand down was the film's most direct act of 
      insubordination, and the one that saved the remaining survivors.

# Character Traits
personality:
  strengths:
    - "Exceptional piloting skill — the best in the Covenant crew"
    - "Emotional directness; says what he feels without manipulation"
    - "Loyalty to people over protocol"
    - "Practical under extreme pressure; grief does not disable him"
    - "Light irreverence that grounds scenes without deflating danger"

  key_trait: |
    Tennessee is the audience surrogate — the person who reacts to events as a normal, 
    loving human being rather than as an ideological position. He does not have a thesis 
    about the nature of creation or the rights of synthetic life. He has a wife, a crew, 
    and a ship. When events strip those away one by one, he keeps moving. His survival 
    is the film's small mercy.

  presence: |
    Danny McBride's casting against type — known for comedy, deployed here in straight 
    dramatic mode with occasional levity — gives Tennessee a lived-in quality that most 
    of the Covenant crew lacks. He feels like a person who existed before the film started 
    and would have continued after it, if the ending were different.

