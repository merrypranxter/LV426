backstory: |
  Faris was the lander pilot aboard the USCSS Covenant, responsible for operating the ship's
  secondary landing craft during the crew's unscheduled stop on Planet 4. She was competent
  and loyal — the kind of crew member who stays at her post when everything goes wrong, because
  someone has to. When a landing party member became infected by neomorph spores and began
  showing signs of rapid biological transformation, Faris was left aboard the lander to contain
  the situation while the rest of the team dealt with the crisis outside.

  The neomorph that emerged from the infected crew member was small, fast, and extremely
  aggressive. Faris was alone with it in an enclosed space. She had a shotgun. She used it.
  In the chaos of trying to kill the creature in the lander's confined interior, she missed —
  or hit the wrong target — and struck the fuel lines. The explosion destroyed the lander
  and killed her.

  The lander's destruction was not incidental. It was the pivot on which the entire film's
  third act turned: without the lander, the surviving crew had no way off Planet 4 without
  the Covenant itself descending, which meant David had leverage, which meant everything
  that followed became possible. Faris died trying to do her job. The consequences of her
  death shaped everything.

