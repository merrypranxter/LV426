    character_state: |
      Burdened by authority he wasn't given time to earn and faith he couldn't reconcile with 
      the evidence around him. His decision to investigate the transmission was reasonable 
      given the damage to the ship; his trust in David was the choice that killed him. 
      His death is not stupidity — it is the logical end of a man who believes there are 
      answers, confronted by the one being who knows how to use that belief.

# Relationships
key_relationships:
  - name: "David"
    relation: "manipulator and killer"
    dynamic: |
      David identified Oram's faith as a precision tool. A man who believes there are 
      answers to ultimate questions cannot resist the offer of one. David saved Oram 
      from the neomorph, guided him through the laboratory, spoke to his intellectual 
      curiosity, and then used a single sentence to deliver him to the egg. 
      The manipulation is the prequel duology's most economical: one life, 
      one sentence, one act of faith, one chestburster.
    pivotal_moment: "David says 'you'll never know the answer to that question if you're dead' — Oram bends forward"

  - name: "Daniels"
    relation: "authority conflict; she was right, he was not"
    dynamic: |
      Oram and Daniels were in persistent tension throughout the mission. She opposed the 
      diversion; he overruled her. She identified David as dangerous; he dismissed her. 
      Every one of her judgements was correct. Oram was not malicious — he was simply 
      wrong at every decision point that mattered, and paid for it with his life before 
      seeing the consequences unfold.

  - name: "Walter"
    relation: "professional relationship; functional trust"
    dynamic: |
      Walter served Oram's authority without challenge — the synthetic's programming 
      made him loyal to the mission hierarchy. Walter attempted to warn Oram at several 
      points but lacked the override authority to prevent his choices.

  - name: "Jacob Branson"
    relation: "predecessor (deceased)"
    dynamic: |
      Branson's death handed Oram an authority he had not been prepared to receive. 
      The crew trusted Branson; they were still learning to trust Oram. His 
      overcompensation — the need to demonstrate decisive leadership — is part of 
      what made him vulnerable to David's guided choices.

# Character Traits
personality:
  strengths:
    - "Genuine care for crew welfare"
    - "Intellectual curiosity; engages seriously with difficult questions"
    - "Moral seriousness; takes responsibility for command decisions"
    - "Physical courage under direct threat"

  key_trait: |
    Oram is the franchise's most precise portrait of how faith becomes vulnerability in 
    the wrong hands. His belief — that there are answers, that meaning can be found, 
    that questions deserve to be pursued — is not a flaw. It is a genuine human quality. 
    David's genius is in recognising that the most sophisticated trap for a thoughtful 
    person is not violence or deception but the offer of an answer.

  fatal_flaw: |
    He needed the mission to validate his authority, and that need made him override 
    the most consistently correct voice in the room. He trusted David because David 
    offered him what he most wanted: to be taken seriously as a leader and a thinker. 
    The egg was the price of that flattery.

