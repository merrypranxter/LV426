# Biography
backstory: |
  Christopher Oram was the Covenant's First Officer and a man of religious faith in a 
  secular crew — a combination that made him feel perpetually undervalued and mistrusted. 
  He was competent, cautious, and genuinely committed to the mission and its people, 
  but his authority was never accepted with the ease that his predecessor Jacob Branson's 
  had been. When Branson died in the neutrino burst, Oram inherited command in the worst 
  possible circumstances: a grieving crew, a broken ship, and a decision with no good options. 
  His belief that there are answers to ultimate questions — that meaning can be found if 
  you are willing to look — made him precisely the kind of person David required.

# Film-by-Film Arc
timeline:
  - film: "Alien: Covenant"
    year: 2104
    role: "Acting Captain; primary authority figure; David's most useful victim"
    key_moments:
      - "Assumes command after Jacob Branson's death in the neutrino burst"
