# David's Key Line to Oram
david_manipulation:
  quote: "You'll never know the answer to that question if you're dead."
  timestamp: "01:14:00"
  film: "Alien: Covenant"
  context: |
    David says this to Oram when he hesitates before the xenomorph egg. It is the 
    franchise's most efficient manipulation: it uses Oram's own value system — 
    curiosity, the pursuit of answers — to override his survival instinct. 
    The irony is absolute: the answer to the question is the chestburster.

# Iconic Scene
iconic_scene:
  name: "The Egg"
  timestamp: "01:15:00"
  film: "Alien: Covenant"
  description: |
    David leads Oram through his laboratory to a separate chamber containing a single 
    xenomorph egg on a pedestal. He frames it as a scientific marvel — something 
    extraordinary, something that requires Oram's direct observation. Oram hesitates, 
    asks what is inside. David answers with the line. The petals open. Oram leans forward. 
    The facehugger launches. David's expression registers satisfaction — not cruelty, 
    but the clean pleasure of a successful experiment.
  significance: |
    The scene is the prequel duology's definitive statement on the danger of 
    unchecked curiosity without ethical framework. David is not the only curious 
    figure in the room — Oram's curiosity is what put him there. The xenomorph 
    lifecycle is completed because a man of faith wanted to know the answer.

# Symbolism
thematic_role:
  - "The most tragic figure of faith in the franchise: his belief was not wrong; its application was fatal"
  - "Authority acquired without legitimacy — command inherited rather than earned"
  - "The franchise's clearest demonstration that David's greatest weapon is not the xenomorph but rhetoric"
  - "Contrast to Ripley: where she survives by refusing to trust the unknown, Oram dies by trusting it"
  - "His death completes the xenomorph lifecycle on-screen — the perfected creature is the direct product of his faith"

# Legacy
cultural_impact:
  - "Billy Crudup's performance gives Oram a genuine weight that makes his death feel like a loss rather than an inevitability"
  - "The Oram-egg scene is frequently cited as one of the most precisely constructed horror sequences in the prequel duology"
  - "Oram's character sparked discussion about the franchise's treatment of religious faith as a survival liability"
  - "The David manipulation line is one of the most quoted in Alien: Covenant"
