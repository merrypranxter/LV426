backstory: |
  Scott Gorman was a Lieutenant in the Colonial Marines, commanding the LV-426 
  squad despite having only two previous combat deployments. He arrived on the 
  Sulaco projecting the formal authority of his rank while visibly uncertain in 
  command. Where Apone provided functional leadership and Hicks provided quiet 
  competence, Gorman provided paperwork and commissions.

  His failure during the initial contact engagement — freezing at the APC command 
  screens while his squad was overwhelmed — is the film's definitive depiction of 
  authority divorced from capability. He is knocked unconscious by falling equipment 
  during Ripley's rescue maneuver. What redeems Gorman is his final act: choosing 
  to stay in a sealed corridor with Vasquez when escape is impossible, and detonating 
  a grenade with her rather than surrender.

