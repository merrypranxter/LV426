  - name: "Ripley"
    relation: "authority_displaced"
    dynamic: |
      Ripley pushes Gorman aside and takes the wheel when he freezes. His 
      incapacitation formally transfers authority to Hicks; Ripley's action 
      demonstrates what functional authority looks like.

personality:
  strengths:
    - "Ultimately chooses courage in extremis"
    - "Follows established protocols — not wrong, just insufficient"
  fatal_flaw: |
    Gorman has rank without the experiential grounding to exercise it under 
    catastrophic stress. His paralysis at the APC screens is not cowardice 
    — it is the failure of training to prepare for actual contact with the 
    franchise's primary threat.

