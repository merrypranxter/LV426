backstory: |
  Al Apone was the Master Sergeant commanding the marine squad aboard the USS Sulaco 
  — the functional backbone of the unit between Gorman's inexperience above and the 
  individual marines below. He was direct, experienced, no-nonsense, and immediately 
  credible as the person who actually ran the squad's daily operations.

  His most significant command decision — confiscating the marines' ammo and 
  restricting them to flares before entering the processing plant, to prevent 
  reactor damage — was tactically correct and contributed to the squad's inability 
  to respond when contact occurred. He was captured during the initial engagement, 
  his fate left ambiguous in the theatrical cut.

