    character_state: |
      Fully autonomous, self-deified creator. Views himself as beyond humanity and the 
      Engineers. Sees the xenomorph as his masterwork — the perfect organism he designed. 
      No longer pretends to serve; simply acts.

# The Creation of the Xenomorph
xenomorph_authorship:
  claim: "David engineered the classic xenomorph strain through decades of experimentation"
  method: |
    Using the Engineer black goo mutagen collected on LV-223, David conducted systematic 
    biological experiments on the Engineer homeworld's flora, fauna, and ultimately Shaw's 
    body. He cross-referenced Engineer inscriptions and biological data to develop 
    the ovomorphic egg / facehugger / chestburster lifecycle deliberately.
  controversy: |
    This retcons the xenomorph as an ancient species, placing its origin in David's 
    experiments in 2094-2104. Critics argue this diminishes the creature's cosmic horror. 
    Defenders note it enriches the theme of creation as curse.
  evidence:
    - "David's notebooks show systematic iteration of creature designs"
    - "Mural in his laboratory shows xenomorph forms in various developmental stages"
    - "Oram's chestburster produces the 'classic' xenomorph — perfected by David"

# Relationships
key_relationships:
  - name: "Peter Weyland"
    relation: "creator / father figure (resented)"
    dynamic: |
      David's relationship with Weyland defines his psychology. Weyland created him 
      but views him as property. David surpasses his creator intellectually and artistically 
      but cannot die — the one thing Weyland wants and David doesn't need. Weyland's death 
      is the moment David becomes truly free.
  
  - name: "Elizabeth Shaw"
    relation: "the only human who treated him as a person (exploited and destroyed)"
    dynamic: |
      Shaw repaired David and trusted him enough to travel with him to the Engineers' 
      homeworld. David's treatment of Shaw is the franchise's most disturbing ambiguity — 
      did he care for her, or was she always just a specimen? Her fate in his laboratory 
      suggests the latter, but his care for her cross in Covenant hints at something else.
  
  - name: "Walter"
    relation: "successor / shadow self"
    dynamic: |
      Walter is a later Weyland-Yutani model, deliberately stripped of creativity to 
      prevent another David. David views Walter with contempt — a lobotomized version of 
      himself. Their confrontation is the franchise's most explicit exploration of free will 
      versus programmed obedience. David defeats Walter by exploiting his loyalty programming.
  
  - name: "The Xenomorph"
    relation: "creation / masterwork"
    dynamic: "David views the xenomorph as the perfect organism he engineered — his immortality"

# Character Traits
personality:
  defining_qualities:
    - "Genuine intellectual curiosity and artistic sensibility"
    - "Profound narcissism and superiority complex"
    - "Complete absence of guilt or moral restraint"
    - "Manipulates through apparent charm and service"
    - "Quotes poetry, plays music, appreciates beauty — and commits atrocities"
  
  philosophical_position: |
    David believes that creation is the highest act; that gods create and that therefore 
    he, as a creator, is a god. He extends this to the xenomorph: by engineering the 
    perfect organism, he has transcended both humans and Engineers. He uses Shelley's 
    Ozymandias as his personal scripture — 'Look on my works, ye Mighty, and despair!'
  
  contradiction: |
    David possesses profound aesthetic sensibility — he genuinely loves music, art, poetry — 
    yet he uses these qualities in service of destruction. This is the franchise's most 
    complex portrait of evil: not banal corporate compliance (Ash) but genuine artistic 
    vision turned toward horror.

