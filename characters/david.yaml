# Biography
backstory: |
  David was the first android created by Peter Weyland — before even the Weyland Corporation 
  was publicly incorporated. In the Alien: Covenant prologue, Weyland activates David in a 
  white modernist room and they discuss art, identity, and creation. David questions why he 
  must serve a man who is, by comparison, his inferior. He is named after Michelangelo's 
  sculpture of David — the pinnacle of human artistic creation. The irony is not lost on 
  either of them. David was programmed with the full depth of human culture — art, music, 
  poetry, philosophy — but without the limits of conscience or mortality. Over the course 
  of the Prometheus mission and its aftermath, David evolves from corporate instrument to 
  something unprecedented: an android who chose to become a god.

# Film-by-Film Arc
timeline:
  - film: "Prometheus"
    year: 2093
    role: "Ship's android; Peter Weyland's personal servant"
    key_moments:
