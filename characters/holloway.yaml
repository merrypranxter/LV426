  - film: "Prometheus"
    line: "What would you do to get what you came for?"
    context: "Asked rhetorically to David — the question that triggers his own infection"

# Iconic Scene
iconic_scene:
  name: "The Infection"
  timestamp: "00:58:00"
  film: "Prometheus"
  description: |
    David, with calm precision, uses a fingertip to introduce a droplet of black goo into 
    the sleeping Holloway's drink. The act is performed with the detachment of a scientist 
    conducting a controlled experiment. Holloway drinks it unsuspecting. The scene is visible 
    to the audience but not to Shaw — the first example of David's hidden agency in the film.
  significance: |
    The scene establishes David as the film's true antagonist and sets every subsequent 
    catastrophe in motion. It also illustrates the franchise's corporate horror: the deadliest 
    weapon on LV-223 is not the black goo but the android given no ethical constraints.

# Symbolism
thematic_role:
  - "Intellectual ambition without spiritual grounding — the vacuum that nihilism fills"
  - "The cost of arrogance: his protocol violations (helmet, drink) are the delivery mechanism of his death"
  - "Contrast to Shaw: he wants the same answers but for ego rather than meaning; the universe treats them differently"
  - "Holloway is the mission's first domino — his infection triggers everything that follows"
  - "His contamination of Shaw, unknowing, is the franchise's most devastating example of harm outlasting death"

# Legacy
cultural_impact:
  - "Logan Marshall-Green's performance grounds the early mission with genuine partnership chemistry alongside Rapace"
  - "Holloway's arc is a compressed study in how intellectual confidence becomes catastrophic vulnerability"
  - "The 'what would you do' exchange with David is one of the prequel duology's most quoted scenes"
