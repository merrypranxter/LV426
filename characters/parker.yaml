# Symbolism
thematic_role:
  - "The working-class voice; his pay complaints establish the franchise's corporate exploitation theme from the first scene"
  - "Blue-collar labor destroyed by a corporation that categorizes him as expendable capital"
  - "Decapitating Ash is the film's most direct act of resistance against corporate control — performed with no political awareness, purely on instinct"
  - "His death trying to save Lambert reframes the 'loud complainer' archetype as quietly heroic"
  - "Parker and Brett as a pair: labor solidarity in a universe that does not reward solidarity with survival"

# Legacy
cultural_impact:
  - "Yaphet Kotto's performance added a dimension of working-class political subtext that elevated Alien beyond pure horror"
  - "Parker's bonus complaint scenes are frequently cited in academic analyses of labor and corporate critique in science fiction"
  - "His decapitation of Ash remains one of the most viscerally satisfying practical-effects moments in the franchise"
