    character_state: "Combative and transactional early; grief-driven and impulsive after Brett's death; dies attempting an act of genuine heroism"

# Relationships
key_relationships:
  - name: "Brett"
    relation: "engineering partner; closest ally"
    dynamic: |
      Parker and Brett functioned as a unit throughout the voyage — Parker assertive and vocal,
      Brett passive and agreeable, both positioned outside the Nostromo's command hierarchy and
      acutely aware of it. Brett's death hits Parker harder than any other event in the film.
      His subsequent aggression and recklessness are grief wearing the mask of action.
    see_also: /characters/brett.yaml

  - name: "Lambert"
    relation: "colleague; died trying to save her"
    dynamic: |
      Parker and Lambert were not particularly close, but his final act was an attempt to flame
      the xenomorph away from her. He rushed in — armed with a flamethrower but unable to fire
      without hitting Lambert — and was killed for it. The impulsive generosity of it is the
      most purely heroic moment in the film.
    see_also: /characters/lambert.yaml

  - name: "Ash"
    relation: "adversary; Parker destroys him"
    dynamic: |
      Parker had no special suspicion of Ash, but when Ash attacked Ripley, Parker did not
      hesitate. He grabbed a fire extinguisher and decapitated the android. It was the crew's
      most effective act against the company's agent, and Parker had no idea how significant
      it was — he was just protecting a crewmate.
    see_also: /characters/ash.yaml

  - name: "Ellen Ripley"
    relation: "fellow survivor; uneasy allies"
    dynamic: "Parker and Ripley were not natural allies — he resented the command hierarchy she represented — but their mutual practicality and shared threat created a functional working relationship in the crisis."
    see_also: /characters/ellen-ripley.yaml

# Character Traits
personality:
  surface_characteristics:
    - "Loud, direct, and perpetually aggrieved about compensation"
    - "Loyal to Brett above all others aboard the ship"
    - "Physically capable and instinctively action-oriented"

  key_trait: |
    Parker's most important trait is not his complaints about money — though they matter
    thematically — but his instinct to act. When Ash attacks Ripley, Parker acts. When the
    xenomorph threatens Lambert, Parker acts. He does not calculate. He does not run. The
    working-class character who other films might cast as comic relief is, in Alien, the one
    person aboard the Nostromo who most consistently throws himself into danger for others.

  on_labor: |
    Parker's pay complaints are not a character flaw — they are a thesis statement. He and
    Brett do the physical work that keeps the Nostromo running, receive the smallest shares,
    and are given no meaningful information about the mission's true nature. Weyland-Yutani
    uses them like hardware. Parker knows it and says so. The film proves him right by
    having the corporation's covert orders treat his life as a line item to be expended.

# Defining Moment — Ash's Decapitation
defining_moment:
  timestamp: "01:24:10"
  film: "Alien"
  description: |
    Ash is strangling Ripley. Parker grabs a fire extinguisher and swings it into Ash's head,
    separating it from his body. White synthetic fluid sprays across the room. It is the single
    most physically decisive act in the film — brutal, fast, and completely unpremeditated.
    Parker saved Ripley's life with a blunt instrument and zero hesitation, which made it
    possible for Ripley to eventually survive and destroy the Nostromo. Everything that follows
    in the franchise flows from this moment.
  significance: "Parker's intervention is the film's pivot — without it, Ripley dies, the organism reaches Earth, and Weyland-Yutani wins"

