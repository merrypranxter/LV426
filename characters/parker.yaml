# Biography
backstory: |
  Samuel Parker was the Chief Engineer of the USCSS Nostromo, responsible for maintaining the
  vessel's systems and overseeing the engineering division alongside his technician, Brett.
  Parker was loud, direct, and chronically preoccupied with the crew's profit-sharing agreement
  — a running complaint that positioned him, from the film's first scene, as the voice of
  working-class labor against corporate indifference. He and Brett were the least senior and
  least compensated members of the crew, doing the most physically demanding work, and Parker
  never let anyone forget it. Beneath the bluster, Parker was practically capable and, when it
  mattered, genuinely brave: it was Parker who decapitated Ash with a fire extinguisher and
  saved Ripley's life. It was Parker who charged toward the xenomorph to save Lambert, the
  action that killed him. Parker died as he lived — acting on instinct, protecting someone else,
  too angry and too human to run.

# Film-by-Film Arc
timeline:
  - film: "Alien"
    year: 2122
    role: "Chief Engineer; engineering-section voice; critical role in destroying Ash"
    key_moments:
      - "Opens the film demanding clarification of crew bonus percentages — establishes the corporate exploitation theme immediately"
      - "Stays in engineering with Brett during the LV-426 landing; skeptical of the detour"
      - "Partners with Brett to maintain and repair ship systems throughout the crisis"
      - "Devastated by Brett's death — Brett was his only real ally aboard the Nostromo"
      - "Decapitates Ash with a fire extinguisher when Ash attacks Ripley (timestamp: 01:24:10)"
      - "Critical role in reactivating Ash's head to extract information from the android"
