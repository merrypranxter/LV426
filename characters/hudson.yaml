key_relationships:
  - name: "Vasquez"
    relation: "volatile_sparring_partner"
    dynamic: |
      Hudson and Vasquez maintain a constant current of competitive antagonism — 
      he performs machismo; she embodies it. Their mutual contempt is genuine but 
      covers genuine mutual respect. The franchise's most economical odd-couple 
      characterization.

  - name: "Hicks"
    relation: "complementary_counterpoint"
    dynamic: |
      Hudson's noise and Hicks's quiet define each other by contrast. Hudson's 
      breakdown makes Hicks's steadiness visible; Hicks's calm is the corrective 
      that prevents Hudson from becoming a liability.

personality:
  strengths:
    - "Technically competent (comtech, motion tracker operation)"
    - "Capable of genuine courage when performance fails and reality demands it"
    - "Loyal to squadmates despite bravado"
  fatal_flaw: |
    Hudson's bravado is his operating system — it works in low-threat environments 
    and fails catastrophically in genuine crisis. When the performance fails him, 
    he has nothing underneath it. His recovery — choosing to fight anyway — is the 
    more interesting character beat.

