backstory: |
  William Hudson was a Private in the Colonial Marines aboard the USS Sulaco, 
  assigned to the LV-426 contact mission. He functioned as a comtech and general 
  infantry soldier, and was defined above all by his performance of invulnerability 
  — a sustained, boisterous bravado that served as psychological armor against the 
  existential reality of deep-space combat.

  Hudson's arc in Aliens is the franchise's most compressed study of bravado's 
  relationship to fear. He arrives loudest, collapses fastest, and ultimately dies 
  bravest. His heroic last stand — pulling himself from the floor while xenomorphs 
  drag him down, continuing to fire — is the film's most unexpected redemption, 
  made effective precisely because of how thoroughly he had performed collapse 
  in the preceding hour.

