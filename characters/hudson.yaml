thematic_role:
  - "Hudson is the franchise's study in what bravado actually is: a performance masking fear, maintained until the performance becomes impossible"
  - "His redemption arc is earned precisely because he is allowed to fully fail first — making the heroism surprising and therefore affecting"
  - "The 'Game over, man' line became the franchise's most quoted moment of human vulnerability, because it is honest where the film's heroics are performed"

