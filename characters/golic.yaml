  key_trait: |
    Golic is the franchise's clearest image of what the xenomorph looks like when it finds
    a human mind that cannot fight it. Not because he lacks courage or intelligence but
    because something in his perception — already fractured before the encounter — finds in
    the creature an absolute that he has never found in anything else. The film does not
    explain this. It presents it, and lets it be as disturbing as it is.

  evolution: "Unstable prisoner → sole survivor of early xenomorph attack → devoted worshipper → instrument of the creature's liberation → immediate casualty"

thematic_role:
  - "The franchise's dark mirror to corporate xenomorph acquisition: a human being arrives at the same conclusion as Weyland-Yutani through psychological fragility rather than profit"
  - "Represents the possibility that some human minds encounter the xenomorph and respond not with fear but with recognition"
  - "His death — killed immediately by the creature he freed — is the franchise's most economical statement about the xenomorph's relationship to human devotion: it does not reciprocate"
  - "Golic's arc asks what the creature looks like to a mind that has no stable category for it — and answers that it looks like God"
  - "The only character in the franchise who actively chooses the xenomorph's side and is destroyed precisely as a result"

