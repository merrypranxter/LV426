backstory: |
  Golic was already considered mentally unstable before the xenomorph arrived. Among a
  population of violent offenders — men imprisoned for the most extreme crimes the justice
  system recognised — Golic stood out as different in kind, not merely degree. The other
  prisoners regarded him with wariness. He occupied a specific register: unpredictable,
  disconnected from the social codes that even violent men maintain, operating according
  to an interior logic that did not map onto anyone else's.

  When the xenomorph killed two prisoners in the waste disposal tunnels, Golic survived.
  He returned covered in blood, barely coherent, and was dismissed initially as having
  committed the murders himself. What the encounter did to him was not what it did to
  anyone else — it did not produce fear. It produced fascination. He had seen something
  that was, to his fractured perception, perfect.

  What followed was the film's darkest mirror to corporate xenomorph acquisition: a human
  being, operating from psychological fragility rather than profit motive, coming to the
  same conclusion the company did. The creature was worth protecting. Worth serving.
  Worth dying for.

