    relation: "devotee_and_sacrificial_victim"
    dynamic: |
      Golic's relationship with the xenomorph is the franchise's most unsettling study of
      human response to the creature. Where every other survivor experiences the xenomorph
      as threat and processes it as something to be fled or destroyed, Golic processes it as
      something beautiful. The creature's perfection — its total commitment to its own nature,
      its absence of ambivalence — speaks to something in his fractured psychology that human
      interaction never reached. He worships it. It kills him without acknowledgment of what
      he has done for it.

