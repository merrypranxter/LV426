# Biography
backstory: |
  Rebecca Jordan — known by her colony nickname "Newt" — was the daughter of Anne and Russ 
  Jordan, colonists at Hadley's Hope on LV-426. When Weyland-Yutani representative Carter Burke 
  directed the Jordans to investigate the derelict alien ship at the coordinates from Ripley's 
  flight recorder, Russ returned infected by a facehugger. The infestation spread rapidly through 
  the colony's 158 residents, and Hadley's Hope was overrun.

  Newt survived alone for weeks in the colony's ventilation shafts and drainage systems, 
  subsisting on nutrients scraped from the walls and evading xenomorphs in tunnels too 
  narrow for the creatures to follow. She was the sole survivor of 158 colonists when the 
  Colonial Marines arrived. Her survival was not luck — it was learned, practical, and 
  methodical in a way that constitutes the film's darkest detail: a six-year-old had become 
  an expert at surviving a xenomorph hive.

# Film-by-Film Arc
timeline:
  - film: "Aliens"
    year: 2179
    role: "Sole surviving colonist; surrogate daughter to Ripley"
    key_moments:
      - "Discovered by Colonial Marines in the colony ruins, curled in a crawlspace, mute from trauma"
