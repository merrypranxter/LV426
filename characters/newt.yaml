# Iconic Scene
iconic_scene:
  name: "The Rescue in the Hive"
  timestamp: "01:45:00"
  film: "Aliens"
  description: |
    Ripley, alone, armed with a pulse rifle and flamethrower taped together, enters the 
    atmosphere processor hive to retrieve Newt before it detonates. She finds Newt cocooned 
    but unimpregnated, cuts her free, and the two flee together. The scene is the film's 
    purest distillation of maternal ferocity — and Newt's "I knew you'd come" is the 
    franchise's most quietly devastating line.
  significance: "Crystallises the Ripley–Newt bond; makes the Alien³ deaths feel like a violation of the audience's earned hope"

# Symbolism
thematic_role:
  - "Childhood innocence annihilated by corporate negligence — Burke's order killed everyone she loved"
  - "Her survival skills are the film's darkest implicit detail: a six-year-old learned to live inside a xenomorph hive"
  - "The emotional core of Aliens; Ripley's motivation, the film's stakes made human"
  - "Her death in Alien³ — off-screen, in an EEV crash, before the film begins — is the franchise's most controversial narrative decision"
  - "Represents what Weyland-Yutani's indifference actually costs, rendered as a child's face"

# Legacy
cultural_impact:
  - "Carrie Henn's only film role; retired from acting after Aliens"
  - "'They mostly come at night... mostly' is one of the most quoted lines in the franchise"
  - "The Ripley–Newt relationship is widely cited as the template for surrogate parent–child bonds in action cinema"
  - "Newt's death in Alien³ remains one of the most debated franchise decisions in sci-fi film history"
  - "Her survival arc — weeks alone in the colony — is retrospectively among the most harrowing implied backstories in the series"
