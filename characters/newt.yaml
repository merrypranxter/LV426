    character_state: "Traumatised, feral, then gradually trusting; hardened survivor who rediscovers childhood"

# Relationships
key_relationships:
  - name: "Ellen Ripley"
    relation: "surrogate_mother"
    dynamic: |
      The emotional core of Aliens. Ripley breaks through Newt's trauma through patience, 
      physical warmth, and by treating her as a person rather than a subject. Newt's gradual 
      re-emergence from silence mirrors Ripley's own emotional defrosting. Ripley descends 
      alone into a xenomorph hive to rescue her — the most purely maternal act in the franchise. 
      Newt calls her "Mommy" at the end. Her death in Alien³ before Ripley can save her 
      again is the wound from which Ripley never recovers.
    pivotal_moment: "Ripley charges back into the atmosphere processor alone, armed, to reach Newt"

  - name: "Corporal Dwayne Hicks"
    relation: "protective_ally"
    dynamic: |
      Hicks treats Newt with consistent gentleness and genuine respect. He never talks down 
      to her, takes her knowledge of the colony layout seriously, and is one of the few marines 
      whose behaviour toward her is entirely without condescension.

  - name: "Anne & Russ Jordan"
    relation: "deceased_parents"
    dynamic: |
      Newt's parents were killed as a direct consequence of Burke's orders to investigate 
      the derelict ship. Her father was Burke's instrument; her mother likely died in the 
      initial infestation wave. Newt does not speak about them in detail — the trauma is 
      encoded in her silence and her refusal to use her real name.

  - name: "Carter Burke"
    relation: "indirect_perpetrator"
    dynamic: "Burke sent Newt's parents to the derelict; is responsible for the deaths of everyone she knew"

# Character Traits
personality:
  strengths:
    - "Extraordinary practical survival instincts for her age"
    - "Intimate knowledge of the colony ventilation and drainage network"
    - "Resilience that borders on the inhuman given her circumstances"
    - "Perceptive emotional intelligence; reads adults accurately"
    - "Capacity for trust once safety is established"

  key_trait: |
    Newt carries a doll's head — the remnant of a toy, stripped down to its most durable 
    component — as a comfort object. The detail is precisely chosen: she has reduced everything 
    in her life to what can survive. Her famous line about the xenomorphs coming "mostly at 
    night... mostly" is delivered with a matter-of-fact calm that is more disturbing than any 
    scream — she has categorised this horror into a manageable schedule.

  evolution: "Mute, feral survivor → cautiously trusting child → surrogate daughter → franchise's most devastating loss"

