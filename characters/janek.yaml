key_relationships:
  - name: "Elizabeth Shaw"
    relation: "operational_respect"
    dynamic: |
      Janek takes Shaw seriously when others dismiss her. It is her account of what the
      LV-223 installation is — a weapons depot — that gives him the information he needs
      to make his final decision. He believes her, which is not nothing in a crew full of
      people with competing agendas.

  - name: "Meredith Vickers"
    relation: "structural_opposites"
    dynamic: |
      Janek and Vickers are the film's twin authority figures — he controls the ship
      operationally, she controls it corporately. Their brief sexual encounter is the film's
      strangest grace note: two people who otherwise have nothing in common, briefly human
      together. He treats her without deference and without contempt, which is probably
      the most respectful thing anyone does for her in the film.

  - name: "Chance and Ravel"
    relation: "crew_who_stayed"
    dynamic: |
      Two crew members who chose to remain aboard with Janek rather than evacuate. The film
      gives them little characterisation, but their choice to stay amplifies Janek's sacrifice —
      his decision was not just his own.

personality:
  strengths:
