    - "Absence of ego — makes the largest decision in the film without needing it acknowledged"
    - "Pragmatic moral courage: does what needs doing without requiring ideological scaffolding"

  key_trait: |
    Janek is the franchise's most understated hero. He is not a soldier, not a scientist, not
    a corporate asset. He is a ship's captain who plays accordion and makes the right call when
    it matters most. His heroism is not dramatic because he does not experience it as dramatic —
    he experiences it as a job. This is what makes it devastating.

  evolution: "Detached contractor → the only person on the ship who correctly understands what is happening → the man who saves Earth"

