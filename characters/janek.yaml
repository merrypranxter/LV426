backstory: |
  Captain Janek commanded the USCSS Prometheus on its deep-space mission to LV-223 — but
  unlike nearly every other person aboard, he held no illusions about what the mission was
  or what it might find. He was a contractor, a ship's captain doing his job. He played
  accordion. He drank. He observed the idealists and the corporatists and the android with
  the same level, unhurried attention, and he waited to see what would actually happen.

  Janek was the antithesis of the mission's official authority structure. Where Vickers
  embodied cold corporate control, Janek embodied the warmth and practicality of the working
  professional. He trusted his instincts, maintained his crew, and had no particular stake in
  whether humanity found its creators. What he did have a stake in was Earth — and when he
  understood clearly that the LV-223 installation had been an Engineer weapons depot
  manufacturing a biological agent targeted at humanity, and that the surviving Engineer was
  now attempting to depart and complete the delivery, Janek made a decision.

  He rammed the Prometheus into the juggernaut. He knew it would kill him and the two crew
  members who stayed with him. He made the call without drama, without a speech, without
  hesitation. He told his crew what he was going to do, gave them the chance to leave, and
  then did it. His sacrifice destroyed the juggernaut over LV-223 and prevented it from
  reaching Earth. No one commissioned a statue.

