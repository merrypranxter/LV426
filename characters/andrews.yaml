thematic_role:
  - "The authority figure whose refusal to acknowledge the threat is the threat — a structural echo of every institutional dismissal in the franchise"
  - "His death mid-sentence is the film's most compressed argument: authority does not protect you from what it refuses to name"
  - "Represents the failure mode of institutional competence: excellent within known parameters, lethal outside them"
  - "The twelfth year of running the facility is the film's way of encoding how long an authority can function on the wrong assumptions before reality arrives"
  - "His dismissal of Ripley rhymes with the company board scene in Aliens — the franchise's persistent insistence that the people who should listen never do"

