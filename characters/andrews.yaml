backstory: |
  Andrews had run Fiorina 161 for twelve years. In that time, he had developed an operating
  philosophy built entirely on the maintenance of order through rigid hierarchy and the
  suppression of disruption. His facility was not comfortable, not humane, and not designed
  to be — it was a containment vessel for men that the system had decided to discard, and
  Andrews was its keeper. He was good at this. The prison functioned under his authority in
  the way that prisons function: through the credible threat of consequence and the enforcement
  of routine.

  What Andrews could not accommodate was information that didn't fit his model. Ripley's
  warning about a xenomorph — a creature he had no framework for and no intention of
  acquiring one — was not a problem to be solved but a disruption to be managed. He managed
  it the way he managed all disruptions: by calling an assembly, announcing his conclusions,
  and dismissing the source of the noise.

  He did not survive to finish the announcement.

timeline:
  - film: "Alien 3"
    year: 2179
    role: "Prison superintendent; institutional obstacle to Ripley's warnings being taken seriously"
    key_moments:
      - "Establishes his authority immediately upon Ripley's recovery — the facility runs on his terms"
