key_relationships:
  - name: "Ellen Ripley"
    relation: "institutional_antagonist"
    dynamic: |
      Andrews processes Ripley as a category of problem he has handled before: the disruptive
      outsider who threatens the facility's equilibrium. He is not malicious — he is
      structurally incapable of hearing what she is telling him. His dismissal of her warning
      is the film's echo of every prior institutional dismissal she has experienced: Burke,
      the company board, the Weyland-Yutani apparatus. Andrews is the franchise's purest
      version of this figure because he doesn't even have the corporate interest as an excuse.
      He simply cannot process a threat he has not encountered before.

  - name: "Aaron (85)"
    relation: "nominal_deputy"
    dynamic: |
      Andrews uses Aaron as a sounding board and errand-runner — the deputy who exists to
      confirm the superintendent's conclusions rather than challenge them. Aaron's survival
      past Andrews becomes one of the film's structural ironies.

  - name: "Clemens"
    relation: "useful_subordinate"
    dynamic: "Treats Clemens with the particular condescension reserved for someone whose failure record is known — functional, but not an equal"

personality:
  strengths:
    - "Genuine competence at institutional management within known parameters"
    - "Consistent application of authority — the prisoners know where they stand with him"
    - "Twelve years of operational experience in an extremely difficult environment"

  weaknesses:
    - "Absolute inability to update his model when confronted with unfamiliar threats"
    - "Conflates disruption-management with threat-management — the tools are different"
    - "Authority as a terminal value: being right about the threat matters less than maintaining hierarchical order"

  key_trait: |
    Andrews is not a fool. He is a competent administrator who has spent twelve years in an
    environment where the greatest threats were predictable — violence, escape attempts,
    contraband. The xenomorph is not predictable. His failure is not stupidity but a
    catastrophic mismatch between his framework and the actual problem. The franchise uses
    him to demonstrate that institutional competence and survival competence are not the
    same thing.

  evolution: "Twelve-year institutional authority → dismisser of the franchise's most repeatedly dismissed warning → the franchise's most precisely timed ironic death"

quotes:
  - film: "Alien 3"
