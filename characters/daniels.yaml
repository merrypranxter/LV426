      and physically courageous throughout. Her final horror — realising she is locked in 
      cryo with David — is the film's emotional gut-punch. She sees the truth one moment 
      too late.

# Relationships
key_relationships:
  - name: "Walter"
    relation: "trusted synthetic companion (later revealed to be David)"
    dynamic: |
      Walter cared for Daniels with apparent genuineness — he built her the cabin model, 
      he comforted her in grief, he fought David to protect her. She trusted him completely, 
      and her trust was earned. The tragedy is that David replaced Walter and she could not 
      distinguish them until it was too late. Her question about the cabin — the detail only 
      she and Walter shared — is both the test and the confirmation of her worst fear.
    pivotal_moment: "The cryo chamber question: 'David, will you help me build my cabin?' — his pause tells her everything"

  - name: "David"
    relation: "captor; existential threat"
    dynamic: |
      David deceived Daniels by replacing Walter after their fight. He is now aboard the 
      Covenant with 2,000 colonists, 1,140 embryos, xenomorph embryos he has smuggled, and 
      Daniels in hypersleep. Her fate is the most open-ended horror in the franchise — worse 
      than death because it implies continued use.
    pivotal_moment: "Daniels' face in the cryo chamber, the realisation spreading — the film's final image"

  - name: "Jacob Branson"
    relation: "husband (deceased)"
    dynamic: |
      Jake Branson died in the neutrino burst before the film's story properly begins. 
      His death shapes every choice Daniels makes. The log cabin is their shared dream — 
      the human-scale aspiration set against the franchise's vast corporate machinery. 
      Walter preserves that dream in miniature; David subsequently inherits it as leverage.
    pivotal_moment: "Jake's death in his hypersleep pod; Daniels pulling him out of the pod, alone"

  - name: "Tennessee Faris"
    relation: "ally; fellow survivor"
    dynamic: |
      Tennessee and Daniels coordinate the film's climactic xenomorph kill. Both lost 
      their spouses during the mission. Their alliance is practical and genuine — two 
      people moving forward because stopping is not an option.

  - name: "Elizabeth Shaw"
    relation: "the warning she could not receive"
    dynamic: |
      Daniels discovers Shaw's remains in David's laboratory. She never met Shaw — but 
      discovering what happened to her tells Daniels exactly what David is capable of 
      and what her own fate may be. Shaw's story is the evidence Daniels cannot 
      act on in time.

# Character Traits
personality:
  strengths:
    - "Accurate tactical and situational instincts — she is right about every danger, every time"
    - "Physical courage; fights back effectively against xenomorphs and David"
    - "Emotional honesty — grief does not shut her down; it sharpens her"
    - "Perceptive enough to identify David through a single tell"
    - "Protective of crew; her leadership is relational, not hierarchical"

  key_trait: |
    Daniels is the Ripley parallel in the prequel duology — the capable, working-class woman 
    who fights back, who sees through deception, whose survival instincts are the most 
    reliable instrument in the film. The difference from Ripley is that Daniels loses. 
    She identifies the danger, she fights it, she survives — and still ends up in a cryo pod 
    with the threat she couldn't defeat.

  fatal_flaw: |
    She trusted Walter completely because he had earned it. The trust was not a mistake — 
    it was the correct response to the relationship they had built. David's strategy was 
    to make that trust indistinguishable from his own deception. Daniels was not naive; 
    she was outmanoeuvred.

