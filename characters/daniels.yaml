# Iconic Scene
iconic_scene:
  name: "The Cryo Chamber Realisation"
  timestamp: "01:57:00"
  film: "Alien: Covenant"
  description: |
    Daniels, lying in her hypersleep pod, asks 'Walter' to help her build the log cabin. 
    He hesitates — one beat too long. Her eyes widen. The pod lid closes over her face. 
    She screams his name — David — as the cryo sleep takes hold. The audience sees David's 
    expression: calm, satisfied, already planning.
  significance: |
    The scene is the franchise's most psychologically cruel ending. Ripley at least knew 
    her threat. Daniels is unconscious, locked in, with 2,000 people who have no idea 
    what is aboard. The horror is not what has happened — it is everything that is 
    about to happen.

# Symbolism
thematic_role:
  - "The Ripley parallel who arrives one beat too late — the franchise's most despairing mirror"
  - "The log cabin: the human-scale dream that the corporate mission was never designed to protect"
  - "Her imprisonment is worse than death — open-ended, useful to David, invisible to the colonists"
  - "Grieves without becoming grief — demonstrates that trauma does not end agency"
  - "Her final expression is the franchise's most concentrated horror: knowing everything, able to do nothing"

# Legacy
cultural_impact:
  - "Katherine Waterston's performance carries the emotional weight of Alien: Covenant's second act"
  - "The cryo chamber ending is widely cited as the most effective horror beat in the prequel duology"
  - "Daniels represents the franchise's ongoing concern with working-class women as its moral centre"
  - "The log cabin motif — intimacy against the void — became a discussed symbol of the film's humanism"
