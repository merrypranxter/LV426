# Biography
backstory: |
  Daniels Branson was the terraforming lead and co-mission planner aboard the USCSS Covenant, 
  a colonization vessel carrying 2,000 sleeping colonists and 1,140 human embryos to the 
  planet Origae-6. She was married to the ship's captain, Jacob Branson, who died in the 
  neutrino burst accident at the mission's opening before the colony was ever reached. 
  Together they had planned to build a log cabin by a lake on Origae-6 — a small, human 
  dream set against the vast enterprise of interstellar colonisation. The synthetic Walter 
  later builds her a small wooden model of that cabin. When the Covenant's mission was 
  diverted to investigate a rogue transmission from a nearby habitable world, Daniels 
  was the first and loudest voice against the change. Her instincts were correct at 
  every stage. It did not save her crew.

