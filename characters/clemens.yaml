    - "Intellectual honesty — does not pretend his crime was smaller than it was"
    - "Practical courage in treating patients others would ignore"

  key_trait: |
    Clemens represents the fallen professional serving penance at civilisation's edge — a
    recurring figure in the franchise's periphery, where the people with nowhere else to go
    end up doing the work that no one else will. His tragedy is not that he was bad at his
    job but that he was briefly, catastrophically, not at his best, and eleven people died.

  evolution: "Disgraced physician → prison doctor quietly serving his sentence → Ripley's only tender connection → the franchise's first prominent casualty of the Fiorina 161 crisis"

