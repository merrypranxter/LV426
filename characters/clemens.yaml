key_relationships:
  - name: "Ellen Ripley"
    relation: "brief_intimate_ally"
    dynamic: |
      Clemens and Ripley's connection is the franchise's most humane acknowledgment that
      Ripley is a person, not only a survivor. He treats her without agenda, and she responds
      to that with a directness unusual for her in dealings with men. The relationship is brief,
      warm, and comprehensively destroyed by the creature's arrival — which functions as the
      film's coldest structural joke: it gives Ripley something to lose before taking it.

  - name: "Superintendent Andrews"
    relation: "institutional_subordinate"
    dynamic: |
      Clemens operates under Andrews's authority without trusting it. Andrews treats him with
      the particular condescension reserved for someone whose failure is on record — useful,
      but not worth respecting. Clemens endures this with the patience of a man who has long
      since stopped expecting the institution to see him clearly.

