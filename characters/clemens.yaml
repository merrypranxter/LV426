backstory: |
  Jonathan Clemens was once a qualified physician. He completed his training and established
  himself in the profession before a single lapse of judgment ended it. Treating patients
  while hungover, he made a drug dosage miscalculation that killed eleven people. He was
  convicted of criminal negligence, stripped of his licence, and sent to Fiorina 161 as
  part of his sentence. He stayed after his release because there was nowhere else to go —
  or because leaving would have meant confronting what he had become.

  The foundry planet was, in its way, an appropriate penance. It needed a doctor more than
  anywhere else would take one. Clemens administered to the prisoners with genuine competence
  and quiet care, practicing medicine in conditions that most trained physicians would have
  refused, for patients who had no other option. His crime had cost him everything, and he
  served its weight out on the edge of the habitable universe.

  His brief relationship with Ripley was the franchise's most explicitly tender interlude.
  Two fallen people, both carrying the weight of catastrophic decisions that were not entirely
  their fault, finding in each other a brief and fragile interval of human warmth before the
  creature arrived and ended it.

