backstory: |
  Frank Elgyn captained the Betty — a mercenary vessel operating in the legal and moral grey
  zones that the late 24th century's corporate-military apparatus creates and requires. He was
  good at what he did. He knew what the Betty was delivering to the USM Auriga. He knew what
  the people they were delivering would be used for. He was comfortable with this — or had
  constructed a working comfort, which amounts to the same thing functionally.

  Elgyn was confident in the particular way of people who have survived long enough in
  dangerous spaces to mistake pattern recognition for safety. He had read enough situations
  correctly to trust his reading. The Auriga was a situation he did not read correctly, and
  he did not survive the error long enough to revise his model.

  He had a personal connection to Call that the film does not fully elaborate — a closeness
  that exists in the texture of their interaction before the Auriga mission begins to unravel.
  His death removes the person most connected to who Call was before the film's events, and
  most connected to the crew's functioning as a unit.

timeline:
  - film: "Alien: Resurrection"
    year: 2381
    role: "Captain of the Betty; the mercenary who knowingly delivers human cargo to the Auriga's xenomorph breeding programme"
