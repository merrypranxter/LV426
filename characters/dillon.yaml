backstory: |
  Dillon arrived at Fiorina 161 convicted of murder and rape — crimes he does not deny. In the
  isolation and austerity of the foundry penal colony, he found religion, or religion found him.
  He became the moral and spiritual anchor of an inmate population that had no other source of
  meaning: double-Y chromosome men, violent offenders, the abandoned end-product of a system
  that had thrown them as far from civilisation as physically possible.

  His conversion was not performance. The prisoners followed him because he offered something
  genuine — a framework for surviving the unsurvivable, a reason to wake up on a planet with no
  sky worth looking at. He organised them into a faith community with its own rituals and
  accountability, and he held that community together through sheer force of conviction and
  personal authority.

  When Ripley arrived, Dillon's first instinct was hostility. She was a woman in a single-sex
  environment, and her presence — along with whatever she had brought with her — threatened
  the fragile order he had built. His eventual alliance with her required him to override that
  instinct in favour of something larger: the lives of the men in his care, and the creature
  that was systematically ending them.

