key_relationships:
  - name: "Ellen Ripley"
    relation: "adversary_turned_ally"
    dynamic: |
      Dillon resents Ripley's arrival on instinct — she disrupts a community built on the
      premise of her absence. His hostility is not personal but structural: a woman in a
      celibate male community built around discipline and isolation. Over the course of the
      film, that hostility is replaced by something harder to name: mutual recognition between
      two people who refuse to stop fighting when every sensible calculation says to stop.
      His death — holding the creature so she can complete the kill — is the final expression
      of an alliance that neither of them would have predicted.

  - name: "The Fiorina 161 Prisoners"
    relation: "spiritual_leader_and_protector"
    dynamic: |
      The prisoners are Dillon's congregation and his responsibility. He has converted his own
      violence into something that serves them — a framework of faith and order in a place
      designed to have neither. When they begin to die, he does not retreat into prayer; he
      organises the counterattack. He is the reason the prisoners function as a community
      rather than a mob.

