  key_trait: |
    Vriess's most significant characteristic is not his wheelchair but what the film does
    with it. The franchise has spent four films in environments hostile to survival and has
    never before placed a disabled character in them as a competent protagonist rather than
    a casualty or a background presence. Vriess does not get a moment where he rises from
    the chair. He does not need one. He manages in the chair, and the film manages the
    environment around that reality.

  evolution: "Essentially stable — Vriess is who he is throughout, which is the point"

thematic_role:
  - "The franchise's first prominently disabled character given a full ensemble role — his wheelchair is never treated as a problem to be solved within the narrative"
  - "Forces the Alien franchise, for the first time, to address physical accessibility in xenomorph-hostile environments as a practical problem rather than a thematic one"
  - "His survival intact and unchanged is the film's quiet statement: the wheelchair does not make him a liability or a candidate for a redemption arc; he is simply a person with a wheelchair"
  - "Dominique Pinon's performance brings a sardonic specificity to a role that could have been thin — his screen presence makes Vriess feel inhabited rather than symbolic"
  - "Represents the franchise's widening of who gets to survive: not just the physically exceptional, not just the unambiguously human, not just the conventionally able-bodied"

