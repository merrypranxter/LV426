backstory: |
  Vriess is the Betty's mechanic — the person responsible for keeping a ship like the Betty
  operational in conditions that would end most vessels. He is good at this work, sardonic
  in his delivery, and does not solicit attention. He also uses a wheelchair.

  The franchise does not explain how Vriess came to need a wheelchair, and the film does not
  treat this as an absence requiring correction. His condition is not backstory, not a wound
  to be healed, not a limitation to be overcome in a moment of crisis. It is simply his
  situation, maintained throughout. Vriess navigates the Auriga — flooded corridors,
  xenomorph-contested spaces, a catastrophically failing ship — in the wheelchair, and the
  film does the work of making this navigable rather than making him someone else.

  He is the franchise's first prominently disabled character, and his treatment is distinctive
  precisely because it is not distinctive: he is a competent crew member who happens to require
  a wheelchair, and the film respects both halves of that sentence equally.

