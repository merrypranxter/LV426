# The Knife Trick
iconic_scene:
  name: "The Knife Trick"
  timestamp: "00:38:00"
  film: "Aliens"
  description: |
    Bishop performs a knife-between-fingers trick at high speed using Hudson's hand; 
    Hudson is terrified but submits. The scene simultaneously establishes Bishop's 
    inhuman precision and his trustworthiness — he controls the danger perfectly.
  significance: "Introduces Bishop's character in a single scene; later paid off when Ripley trusts him completely"

# Symbolism
thematic_role:
  - "Redemption of the synthetic after Ash's betrayal"
  - "Proof that loyalty and virtue are not exclusively human traits"
  - "The company's corrective; shows Weyland-Yutani can make something genuinely good"
  - "Mirrors Ripley's arc: both stripped to their essential selves by the end"

