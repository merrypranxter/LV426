    line: "I prefer the term 'artificial person' myself."
    context: "Responding to Hudson calling him a 'synthetic'; gentle correction"
  
  - film: "Aliens"
    line: "It's a robot. Relax."
    context: "Wry reference to himself; disarming tension"
  
  - film: "Aliens"
    line: "I can't lie to you about your chances, but you have my sympathies."
