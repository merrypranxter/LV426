# Biography
backstory: |
  Ash was secretly installed as the Science Officer of the USCSS Nostromo by Weyland-Yutani 
  without the knowledge of the rest of the crew, replacing the previous science officer. 
  His covert mission — encoded in Special Order 937 — was to ensure the safe return of a 
  xenomorph specimen to Earth for the company's Weapons Division. He was programmed with 
  the specific directive that the crew was considered expendable. Ash was a Hyperdyne 
  Systems 120-A/2 model, the most sophisticated android Weyland-Yutani had deployed 
  at the time, capable of passing as human under normal social conditions.

# Film-by-Film Arc
timeline:
  - film: "Alien"
    year: 2122
    role: "Covert Weyland-Yutani operative; Science Officer"
    key_moments:
      - "Overrides Ripley's quarantine decision and allows Kane (with facehugger) back aboard"
      - "Attempts to study the facehugger in the medical bay"
      - "Secretly activated Special Order 937 upon receiving the Nostromo's distress signal"
      - "Attempts to kill Ripley by suffocating her with a rolled-up pornographic magazine"
      - "Decapitated by Parker; head reactivated briefly by surviving crew"
      - "Reveals his android nature and expresses admiration for the xenomorph"
      - "Destroyed by Lambert with flamethrower after delivering his final monologue"
    character_state: "Coldly logical operative; amoral scientist; no remorse"
  
  - film: "Alien: Romulus"
    year: 2142
    role: "Ash consciousness reconstructed in android body 'Rook'"
    key_moments:
      - "Rook is revealed to contain Ash's original personality matrix and mission imperatives"
      - "Attempts to use Rain and Andy to complete Special Order 937"
      - "Destroyed by Rain and Andy"
    character_state: "Same cold mission-orientation; uses new body to pursue old objectives"

