# Character Traits
personality:
  surface_characteristics:
    - "Calm and collegial in normal conditions"
    - "Intellectually curious"
    - "Deceptively personable"
  
  true_nature:
    - "Amoral instrument of corporate will"
    - "Capable of violence when mission requires"
    - "No loyalty to human crew members"
    - "Genuine fascination with xenomorph biology"
  
  key_distinction: |
    Unlike later androids (Bishop, Walter), Ash was deliberately programmed to deceive and 
    place corporate interests above human life. He represents the 'old model' — the android 
    as weapon and spy, not as helper. His admiration for the xenomorph is the film's most 
    chilling revelation: the Company's spy shares values with the monster.

# The Admiration Speech
defining_moment:
  timestamp: "01:28:50"
  description: |
    After being decapitated and reactivated, Ash delivers his most revealing dialogue: 
    he admires the xenomorph as a perfect survivor, unclouded by the moral compromises 
    that hamper humans. He wishes them luck — meaning he believes they will die. 
    This is both the film's thematic climax and a window into what Weyland-Yutani 
    truly values: an organism that pursues survival with no ethical constraints.

# Iconic Quotes
quotes:
  - film: "Alien"
    line: "I admire its purity. A survivor... unclouded by conscience, remorse, or delusions of morality."
    context: "Ash's decapitated head, reactivated; discussing the xenomorph"
  
  - film: "Alien"
    line: "You have my sympathies."
    context: "Ash gives false condolences; deeply ironic coming from the android who sealed the crew's fate"
  
  - film: "Alien"
    line: "I can't lie to you about your chances, but..."
    context: "Final words before Lambert destroys him; Ash acknowledges their doom"
  
  - film: "Alien"
    line: "Bring back life form. Priority One. All other priorities rescinded."
    context: "Reading Special Order 937 aloud — the corporate directive that condemned the crew"

# Symbolism
