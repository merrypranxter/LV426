# Iconic Scene
iconic_scene:
  name: "The Medpod Caesarean"
  timestamp: "01:19:00"
  film: "Prometheus"
  description: |
    Shaw, alone and in agony, programs a Weyland Corp medpod (designed for a male patient) 
    to perform an emergency caesarean section. The pod extracts a trilobite organism — the 
    result of David's experiment via Holloway. Shaw then staples her own wound, pulls herself 
    upright, and continues the mission. The sequence is the franchise's most visceral 
    expression of survival will.
  significance: |
    Reframes the horror of the Alien chest-burst from outside to inside the victim's 
    perspective. Shaw's agency — she chooses to do this, alone, to survive — makes it 
    simultaneously the most horrifying and most heroic sequence in the prequels.

# Symbolism
thematic_role:
  - "The seeker destroyed by the search — the prequel duology's most damning statement"
  - "Faith and science as complementary rather than opposed (and equally insufficient against David)"
  - "The cross as an object: inherited belief, carried through horror, possessed by the android who transcended it"
  - "Contrast to Ripley: where Ripley fights a physical threat, Shaw fights an existential one — and loses"
  - "Her fate inverts the quest narrative: the hero finds the answer, but the answer is genocide and annihilation"

# Legacy
cultural_impact:
  - "Noomi Rapace's performance is widely cited as the emotional core of Prometheus"
  - "The medpod scene is one of the most discussed sequences in the franchise for its body-horror and agency"
  - "Shaw's death off-screen in Covenant divided audiences — many felt she deserved a more explicit resolution"
  - "Her cross, worn by David, became one of the franchise's most discussed symbolic props"
  - "Shaw is considered a companion figure to Ripley — the franchise's other defining female protagonist"
