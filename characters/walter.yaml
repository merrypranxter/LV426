# Fate
ambiguous_ending:
  description: |
    The film's final act never explicitly shows Walter's fate after his fight with David. 
    David arrives at the Covenant's landing site with injuries consistent with having been 
    in a fight — but it is not shown whether he killed Walter or simply incapacitated him. 
    The film strongly implies David won and assumed Walter's identity, but Walter surviving 
    in some form remains possible.
  significance: |
    The ambiguity is intentional — it mirrors the franchise's broader question about 
    whether decency and loyalty can survive in a universe governed by David's logic.

# Symbolism
thematic_role:
  - "The angel that refused to fall — where David chose power, Walter chose service"
  - "Institutional trust versus individual will"
  - "The corrective to David — what humanity learned from its worst creation"
  - "Loyalty as its own form of heroism, even when it fails"

# Legacy
cultural_impact:
  - "Michael Fassbender's dual performance is the critical high point of Alien: Covenant"
  - "Walter is frequently cited as a more sympathetic and interesting character than most human cast members"
  - "The David/Walter dichotomy is a standard reference point in discussions of AI ethics in fiction"
