key_relationships:
  - name: "Ellen Ripley 8"
    relation: "adversary_turned_companion"
    dynamic: |
      Call arrives intending to kill Ripley. What she encounters is more complicated: a being
      who is also not fully what she appears, who also exists between categories, who is also
      regarded as a problem by the institutions that created her. Their eventual relationship
      is not friendship in a conventional sense but something more precise — two entities who
      have both been told they shouldn't exist, finding in each other a partial recognition.
      Ripley's line to Call — "I'm not the monster. You are" — is ironic in a way that
      neither of them fully resolves.

  - name: "Frank Elgyn"
    relation: "crew_associate_with_personal_dimension"
    dynamic: |
      Elgyn is Call's captain and the person closest to her among the Betty crew before the
      Auriga infiltration. Their relationship has a personal dimension that the film does not
      fully elaborate. His early death removes the person most connected to her prior life
      and prior role.

  - name: "Johner"
    relation: "hostile_crewmate"
    dynamic: "Johner is contemptuous of Call before and after her synthetic nature is revealed; the film uses him as a register of how humans treat entities they decide to devalue"

personality:
  strengths:
    - "Genuine moral agency — acts on conscience rather than programming"
    - "Technical capability: can interface directly with ship systems"
    - "Strategic intelligence: successfully infiltrated the Auriga crew"
    - "Moral courage: willing to attempt actions that will cost her everything if it prevents the xenomorphs reaching Earth"

  key_trait: |
    Call is disturbed by her own synthetic nature in a way that no prior franchise android
    demonstrated. Ash had no detectable discomfort. Bishop accepted his nature with equanimity.
    Call finds it painful — not because she was designed to but because she has thought about
    it. The discomfort is the proof of the very moral agency she doubts she possesses.

  evolution: "Covert operative intending to kill Ripley → exposed synthetic → ally → the person who turns the ship away from Earth"

