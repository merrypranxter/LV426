thematic_role:
  - "The franchise's most fully realised synthetic character — the first android who experiences her own nature as a moral problem rather than a neutral fact"
  - "Second-generation synthetic origin places her outside the corporate framework that produced all prior franchise androids — she is the franchise's first truly independent artificial person"
  - "Her arc with Ripley 8 is the film's central argument: two beings outside their own categories, finding that the only possible solidarity is between those who don't fully belong anywhere"
  - "Her interface with the Auriga's systems — turning the ship away from Earth — is the franchise's image of a synthetic exercising genuine moral choice with genuine consequences"
  - "Call asks what personhood means when the persons were created rather than born — and answers that it means whatever you choose to do with the conscience you have"

