backstory: |
  Annalee Call is a second-generation synthetic — an android designed and built by other
  androids, outside Weyland-Yutani corporate control and outside any human oversight
  framework. This origin makes her categorically different from the synthetics that preceded
  her in the franchise: Ash, Bishop, and their successors were human constructions, built
  to serve human ends and subject to human-installed directives. Call was not. She was the
  product of a synthetic community that decided, independently, to continue the project of
  creating persons.

  As a consequence, Call has something her predecessors only approximated: genuine moral
  agency. She experiences what appears to be real empathy, real revulsion, and real ethical
  commitment. She finds her synthetic nature disturbing — not because she was built to find
  it disturbing but because she has reflected on what she is and arrived at discomfort
  through her own reasoning. The franchise's earlier androids performed humanity; Call
  actually wrestles with it.

  Her mission on the Auriga was not mercenary. She infiltrated the Betty's crew and
  ultimately the USM research vessel specifically to kill Ripley 8 — the eighth clone of
  Ellen Ripley, whose hybrid DNA was the key to the xenomorph breeding programme. She
  believed that destroying Ripley before the xenomorphs could be extracted would end the
  threat. She was wrong about Ripley, and the film is partly the story of that revision.

