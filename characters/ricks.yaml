backstory: |
  Ricks was a crew member aboard the USCSS Covenant, serving in a support capacity on what
  was intended to be a routine colonisation mission to Origae-6. The Covenant carried over
  two thousand colonists in hypersleep alongside a smaller active crew; Ricks was part of the
  ensemble of working professionals who would have managed the mission's operational needs
  during the seven-year journey.

  The unscheduled detour to Planet 4 — following the interception of a rogue transmission —
  transformed a planned colonisation mission into a survival situation. Ricks was among the
  crew members caught in the escalating disaster that followed first contact with David's
  experiments and the xenomorph and neomorph organisms on Planet 4.

