  key_trait: |
    Fifield's defining quality is his refusal to perform investment in the mission. Every other
    crew member has a story — wonder, grief, corporate ambition, existential longing. Fifield
    has a paycheck. In a film full of people whose idealism gets them killed, Fifield's
    cynicism gets him killed just as quickly. The black goo is not selective.

  evolution: "Mercenary realist → lost and frightened in the dark → externalised aggression"

