backstory: |
  Fifield was the Prometheus expedition's geologist — responsible for deploying the mission's
  mapping probes and navigating the team through the LV-223 installation. He was abrasive,
  openly mercenary, and made no effort to hide that he was on the mission for the money. He had
  no investment in the scientific or philosophical questions driving Shaw, Holloway, and Weyland.
  He found the idealism around him contemptible and said so. In a crew full of people who wanted
  to find something, Fifield wanted to get paid and go home.

  The irony of his death is structural: the geologist who deployed the mapping probes got lost
  in the installation. He and Millburn were cut off from the team during the crew's hasty
  evacuation and forced to shelter inside the structure overnight. There they encountered the
  black goo mutagen and the Hammerpede organisms — mutated worms gestating in the substance —
  and Fifield's contact with the goo began a transformation that destroyed him.

  He returned to the Prometheus in a state of extreme physical mutation: elongated, aggressive,
  apparently indestructible. He killed multiple crew members in the docking bay before being
  stopped. His arc is the film's thesis statement on the black goo: it does not create, it
  amplifies. Fifield came to LV-223 driven by fear and greed. The mutagen took those qualities
  and built a body around them.

