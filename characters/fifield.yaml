key_relationships:
  - name: "Millburn"
    relation: "reluctant_companion"
    dynamic: |
      Fifield and Millburn are an odd pair — the hostile cynic and the eager naif — who
      end up sharing the worst night in the LV-223 installation by accident. Fifield's
      aggression during their isolation reads less like courage than fear. He is terrified
      and performs contempt as a coping mechanism. Millburn, characteristically, attempts
      to soothe him.

  - name: "The Black Goo"
    relation: "victim_and_product"
    dynamic: |
      The mutagen takes Fifield's dominant psychological traits — fear, aggression, self-interest
      — and reconstitutes them in a body stripped of everything else. Whether this is the goo's
      designed function or a side effect of its interaction with human biology is left open,
      but the thematic logic is consistent.

