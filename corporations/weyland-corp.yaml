# Corporate Philosophy (Pre-Merger)
philosophy: |
  Weyland Corp under Peter Weyland was driven by one man's ego and hunger for transcendence. 
  Unlike the merged entity's institutional indifference, Weyland Corp was personal — 
  Peter Weyland wanted to be a god, wanted to live forever, and built a corporation 
  as the instrument of that ambition. His employees were extensions of his will; 
  the Prometheus crew were pawns in a private obsession he dressed as exploration.
  
  The irony of Weyland Corp: it created David — the only entity that actually achieved 
  what Weyland wanted. David does not age. He creates life. He outlasts his creator. 
  In trying to play God, Weyland actually made one.

# Relationship to Yutani
yutani_notes: |
  Yutani Corporation is the less-documented half of the merger. In expanded universe 
  material, Yutani is portrayed as a rival company that competed with Weyland in 
  android and terraforming technology. The merger created a corporate entity with 
  Weyland's technology base and Yutani's financial or political resources. 
  The specific terms and timeline of the merger are not depicted in the main film canon.
