      Cold, efficient, and contemptuous of her father's mysticism. Vickers served as 
      the practical face of the Prometheus mission — ensuring corporate assets were 
      protected and Weyland's personal agenda didn't expose the company unnecessarily. 
      She is everything her father is not: ruthless and without illusions about mortality.
