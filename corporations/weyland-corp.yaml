# Founding
founding:
  founder: "Sir Peter Weyland"
  founded: "~2012"
  origin_event: |
    Peter Weyland's TED Talk in 2023 (in-universe promotional material) established 
    his public persona as a visionary: 'We are the gods now.' The company grew from 
    Weyland's personal ambition to achieve immortality through technology and exploration. 
    Weyland Corp would become the dominant force in off-world exploration, android 
    manufacturing, and terraforming within decades.

# Peter Weyland
founder_profile:
  name: "Sir Peter Weyland"
  portrayed_by: "Guy Pearce"
  appears_in: "Prometheus (2012), Alien: Covenant (2017 prologue)"
  character: |
    Peter Weyland was a narcissistic visionary who genuinely believed himself to be 
    a god among men — or at least a man among gods. He built the most powerful corporation 
    in human history, created the first true synthetic intelligence (David), and ultimately 
    funded the Prometheus expedition as a personal quest for immortality from the Engineers. 
    His arrogance was total; he believed the Engineers would grant him extended life 
    as his due. They killed him immediately.
  
  key_quote: "We are the gods now."
  fate: "Beaten to death by the awakened Engineer on LV-223, 2093"
  legacy: |
    Weyland's ambition seeded everything that followed: David's creation, the Engineer 
    contact mission, the xenomorph discovery (via David's subsequent work), and ultimately 
    the Weyland-Yutani merger that would pursue the xenomorph weapon through the 22nd century.

