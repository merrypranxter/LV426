legacy:
  awards: "Academy Award nomination: Best Visual Effects"
  box_office: "$159.8 million worldwide"
  cultural_impact: |
    Deeply divisive on release; killing Newt and Hicks before the opening credits shocked 
    audiences. Re-evaluated over time as a bleak, nihilistic art film. The Assembly Cut is 
    now considered superior to the theatrical version.

# Connections
