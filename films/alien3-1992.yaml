# Production Notes
notable_crew:
  screenplay: "David Giler, Walter Hill, Larry Ferguson (story by Vincent Ward)"
  production_design: "Norman Reynolds"
  cinematography: "Alex Thomson"
  note: |
    Famously troubled production; Fincher disowned the film after extensive studio interference. 
    An 'Assembly Cut' was released in 2003 for the Alien Quadrilogy box set, restoring 
    approximately 30 minutes of footage including an ox host for the xenomorph (replacing the dog).

influences:
