# Core Data
plot_summary: |
  Following the events on LV-426, an electrical fire aboard the USS Sulaco causes an 
  emergency pod to jettison. The EEV crashes on Fiorina "Fury" 161 — a bleak foundry 
  planet housing a maximum security prison for violent male offenders. Ripley is the 
  only survivor; Newt and Hicks are killed in the crash. She discovers a xenomorph 
  also survived — gestated in a dog or ox brought aboard the Sulaco. As the creature 
  picks off the prisoners one by one, Ripley learns she is carrying an Alien Queen 
  embryo within her own chest.

