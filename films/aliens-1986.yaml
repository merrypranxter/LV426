# Core Data
plot_summary: |
  57 years after the Nostromo incident, Ellen Ripley is rescued from hypersleep and 
  brought before a Weyland-Yutani inquiry board that strips her of her flight officer 
  status. When contact is lost with the colonists of LV-426, Ripley is recruited as a 
  civilian advisor accompanying a squad of Colonial Marines aboard the USS Sulaco. 
  What they find is a colony overrun by xenomorphs, a single child survivor named Newt, 
  and a hive built around the colony's nuclear reactor — presided over by a Queen.

