# Core Data
plot_summary: |
  A group of young colonists on the mining colony Jackson's Star, indentured to 
  Weyland-Yutani and dreaming of a free life on a habitable world, discover that 
  an abandoned Weyland-Yutani space station called the Renaissance holds the key 
  to their escape — specifically, hibernation pods with enough fuel to reach their 
  destination. The station, however, is not empty. It contains xenomorph specimens 
  recovered from the wreckage of the USCSS Nostromo — and experimental material 
  from the remains of Ash. What begins as a salvage mission becomes a desperate 
  survival horror as the xenomorphs break containment and a new horror is unleashed 
  from Weyland-Yutani's biological experiments.

