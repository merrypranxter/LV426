# Core Data
plot_summary: |
  Two centuries after Ellen Ripley's sacrifice on Fiorina 161, military scientists aboard 
  the Auriga science vessel have cloned her using preserved DNA, extracting the dormant 
  Alien Queen embryo in the process. "Ripley 8" — the eighth successful clone — is a 
  human-xenomorph hybrid with enhanced strength, reflexes, and acid blood. The military 
  is breeding xenomorphs for weapons research using human hosts acquired from a mercenary 
  vessel, the Betty. When the aliens inevitably escape, Ripley 8 must navigate her complex 
  dual nature as both predator and prey — and face a disturbing new hybrid offspring.

