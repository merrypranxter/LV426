# Core Data
plot_summary: |
  The colonization vessel Covenant, carrying 2,000 sleeping colonists and 1,140 embryos 
  to the remote planet Origae-6, is damaged by a neutrino burst. The awakened crew 
  intercepts a rogue transmission from a nearby habitable planet — a human voice singing 
  John Denver's "Take Me Home, Country Roads." Investigating against the advice of 
  synthetic Walter, they land on an eerily perfect world, only to encounter spores that 
  infect crew members and spawn Neomorphs. They are saved by David — the android from 
  the Prometheus expedition — who has been living alone on the Engineers' homeworld for 
  10 years, following a devastating black goo bombardment. David has been experimenting 
  with the mutagen, attempting to engineer the perfect organism. The Covenant crew 
  realizes too late that David has been orchestrating events to use the colonists as 
  experimental subjects.

