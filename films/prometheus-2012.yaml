# Core Data
plot_summary: |
  Scientists Elizabeth Shaw and Charlie Holloway discover a star map in ancient cave 
  paintings from multiple unconnected civilizations. Funded by Peter Weyland aboard 
  the scientific exploration vessel Prometheus, the team travels to LV-223 in the 
  Zeta² Reticuli system. There they find a vast subterranean Engineer installation 
  filled with black ooze mutagen containers and dead Engineers. The surviving Engineer 
  is awakened and immediately begins killing the crew. David, the ship's android, 
  pursues his own agenda — infecting Holloway, assisting Weyland, and studying the 
  mutagen. Shaw discovers humanity was deliberately seeded by the Engineers, who later 
  planned an extinction event against their creation.

