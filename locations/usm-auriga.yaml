# Corporate Responsibility
weyland_yutani_usm_role:
  historical_action: |
    Weyland-Yutani collected Ripley's blood from Fiorina 161 immediately after her death — 
    confirming that they had full intelligence on the circumstances of her suicide and 
    were present on the planet. They preserved genetic material specifically to 
    continue the xenomorph acquisition program she had died to prevent.
  
  actions:
    - "Preserved Ripley's DNA specifically to re-extract the Queen embryo she sacrificed herself to deny them"
    - "Conducted 200 years of cloning research — seven failed attempts, each producing suffering"
    - "Operated a live xenomorph breeding program using unconsenting human hosts delivered by mercenaries"
    - "Located the facility in deep space specifically to avoid oversight — not to protect populations"
    - "Failed to contain xenomorphs; navigation failure sent the Auriga toward Earth"
  
  two_hundred_year_patience: |
    The Auriga program is the franchise's proof that Weyland-Yutani's institutional 
    will transcends any individual human life — or any number of human deaths. They 
    waited two centuries. They cloned a person who had died specifically to stop them. 
    They extracted the thing she died to prevent. They are not a company. They are an 
    appetite.

# Thematic Role
thematic_significance:
  - "The Auriga is the culmination of every corporate xenomorph acquisition attempt in the franchise — they finally succeeded, and it destroyed them"
  - "Clone Room 1-7: the cost of bringing Ripley back, seven times wrong — the franchise's most explicit image of science without ethics"
  - "Ripley 8 is not a resurrection but a reinvention — she inherits Ripley's memories and Ripley's grief without being Ripley; a new person made from an old wound"
  - "The Newborn: the franchise's maternal horror at maximum distillation — xenomorph offspring that looks human, calls Ripley mother, and must be killed"
  - "Earth in the film's final shots: the only time the franchise shows Earth; the crash is off-screen; the scale of the threat is left to imagination"
  - "200 years: the corporation outlived the person who defeated them, retrieved her genetics, and continued exactly where they left off — institutions do not feel loss"
  - "Call as the franchise's ethical android: built by androids for androids, serving no corporation, guided entirely by conscience — the endpoint of the synthetic character arc"

