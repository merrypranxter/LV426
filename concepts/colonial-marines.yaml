thematic_role:
  - "The marines represent institutional military confidence meeting a threat their doctrine cannot process"
  - "The squad is diverse, capable, and well-equipped — and almost entirely wiped out. The franchise's argument is about the nature of the threat, not the competence of the soldiers"
  - "Gorman's failure encapsulates the franchise's recurring theme: rank without competence is lethal"
  - "Hicks's assumption of command is the film's counter-argument: authority should be functional, not hierarchical"

