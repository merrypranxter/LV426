name: "United States Colonial Marine Corps"
designation: "USCMC"
category: "Military organization"
first_appearance: "Aliens (1986)"

overview: |
  The United States Colonial Marine Corps (USCMC) is the primary military force 
  of the United Americas in the Alien franchise timeline. Tasked with the defense 
  and enforcement of United Americas interests across colonized space, the Colonial 
  Marines respond to threats including colonial insurrections, piracy, and 
  extraterrestrial contact situations. In practice, the USCMC is frequently deployed 
  as a contractor force by Weyland-Yutani — with the LV-426 mission being the 
  franchise's primary example.

