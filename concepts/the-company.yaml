---
name: "The Company"
full_name: "Weyland-Yutani Corporation"
tagline: "Building Better Worlds"
category: "Megacorporation / franchise antagonist"
first_appearance: "Alien (1979)"

overview: |
  Weyland-Yutani Corporation — universally referred to by its employees and victims 
  as "the Company" — is the primary institutional antagonist of the Alien franchise. 
  A megacorporation with interests spanning terraforming, deep-space mining, 
  commercial spaceflight, weapons development, and biological research, 
  Weyland-Yutani operates on a scale that renders individual human lives 
  statistically negligible.

  The Company's defining characteristic across the franchise is the consistent 
  prioritization of xenomorph acquisition for its Weapons Division over any 
  competing consideration — including the lives of employees, colonists, military 
  personnel, and civilians. This priority is institutional: it appears in classified 
  directives, in the behavior of android agents, in the decisions of corporate 
  representatives, and ultimately in the architecture of every mission the Company 
  touches.

