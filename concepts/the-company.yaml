thematic_role:
  - "The Company represents capitalism's willingness to treat human lives as line items in a cost-benefit analysis"
  - "Its xenomorph acquisition program is the franchise's sustained metaphor for the arms race: the pursuit of biological weapons that cannot be controlled"
