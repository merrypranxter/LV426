towing_operations:
  significance: |
    Several franchise vessels are explicitly towing vessels — the Nostromo tows 
    a massive ore refinery; later vessels carry cargo platforms. The franchise's 
    use of commercial towing establishes deep space as an industrial environment, 
    not an exploratory one. FTL travel is infrastructure, not adventure.

hypersleep_necessity:
  rationale: "Even FTL travel requires weeks to years for interstellar voyages; crew cannot remain awake for the full transit duration"
  consequence: "The temporal displacement of hypersleep is the technology's primary dramatic function in the franchise"
  see_also: "/technology/hypersleep.yaml"

thematic_role:
  - "FTL travel enables the franchise's isolation: ships are unreachably far from help once committed to transit"
  - "The commercial framing of deep space travel — towing, ore runs, colony supply routes — grounds the franchise in working-class reality rather than exploration fantasy"
  - "In distress, no one can hear you scream — not because of sound physics, but because rescue is months away at minimum"

