---
name: "Faster-Than-Light Travel"
designation: "FTL / Interstellar Transit Systems"
category: "Space travel technology"
first_appearance: "Alien (1979)"

overview: |
  Interstellar travel in the Alien franchise is accomplished through a combination 
  of faster-than-light (FTL) propulsion and mandatory cryogenic hypersleep. The 
  mechanics of FTL travel are never technologically detailed in the films; the 
  franchise treats interstellar transit as a taken-for-granted infrastructure 
  element, focusing instead on its human costs — primarily the temporal displacement 
  caused by extended hypersleep periods.

