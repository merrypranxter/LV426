first_appearance: "Alien (1979)"

description: |
  The "Space Jockey" is the colloquial name for the fossilized remains of an 
  Engineer found aboard the derelict alien ship on LV-426. The creature was 
  discovered in a command chair-like structure, with its ribcage visibly burst 
  outward from the inside — a chestburster exit wound. The body had fossilized 
  to the chair, suggesting extreme age.

  The Space Jockey's species was formally identified in Prometheus (2012) as 
  the Engineers — the same beings whose DNA seeded life on Earth billions of 
  years ago. The derelict ship is an Engineer juggernaut, and its cargo holds 
  contained thousands of xenomorph eggs.

