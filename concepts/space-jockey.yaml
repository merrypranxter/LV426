the_distress_signal:
  nature: "Automatic transmission; Ripley theorizes it was a warning, not a distress call"
  ash_assessment: "Could be a warning. It was only received; never decoded"
  significance: |
    The transmission drew the Nostromo to LV-426 — the chain of events that began 
    the entire franchise. Whether the signal was a distress call, a warning to 
    others to stay away, or a locator beacon for recovery is never definitively 
    resolved in the theatrical cuts.

continuity_problem:
  issue: |
    Ash estimates the Space Jockey has been dead "for a long time" — fossilization 
    suggesting hundreds to thousands of years minimum. However, Alien: Covenant 
    establishes that David engineered the xenomorph species approximately 2094–2104, 
    only 18-28 years before the Nostromo's arrival in 2122. This is a significant 
    continuity contradiction.
  interpretations:
    - "David refined an existing Engineer bioweapon; the LV-426 eggs predate David's work"
    - "The fossilization was cosmetic enhancement for theatrical impact; timeline is compressed"
    - "The contradiction is unresolved; Ridley Scott has not publicly addressed it"
  see_also: "/TIMELINE.md"

thematic_role:
  - "The Space Jockey is the franchise's founding mystery — the question that opened everything"
  - "Its fate (killed by its own cargo) foreshadows every human's relationship with the xenomorph"
  - "The scale of the Space Jockey established the alien as part of something incomprehensibly larger"
  - "Prometheus answered 'what was it?' without answering 'why did it come here?' — the mystery deepened"

