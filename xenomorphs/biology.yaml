---
subject: "Xenomorph XX121 — Biological Profile"
classification: "Endoparasitoid extraterrestrial species"
data_sources:
  - "Alien (1979) — film canon"
  - "Aliens (1986) — film canon"
  - "Alien³ (1992) — film canon"
  - "Alien: Resurrection (1997) — film canon"
  - "Prometheus (2012) — film canon"
  - "Alien: Covenant (2017) — film canon"
  - "Ash's Medical Report (Alien) — in-universe document"

# Acid Blood
acid_blood:
  common_name: "Acid blood / Molecular acid"
  composition: |
    The xenomorph's circulatory fluid functions as a highly concentrated molecular acid. 
    It is analogous to, but stronger than, known acids such as hydrofluoric or sulfuric acid. 
    It can dissolve multiple layers of spacecraft-grade alloy within seconds.
  
  ph: "Estimated pH 0-1 (beyond standard pH scale for concentrated acids)"
  
  temperature: "Ambient body temperature — does not combust spontaneously"
  
  practical_implications:
    - "Wounding a xenomorph in an enclosed metal environment risks hull breach"
    - "On the Nostromo, acid blood cut through multiple deck plates before becoming inert"
    - "This is the organism's primary passive defense — killing it may kill you too"
    - "Ripley 8 (human-xenomorph clone) has diluted acid blood — can touch it briefly"
  
  tactical_impact: |
    The acid blood effectively prohibits conventional ballistic combat in pressurized 
    environments. Colonial Marines on LV-426 were instructed to use short, controlled 
    bursts and avoid torso shots in enclosed spaces. This tactical constraint is a key 
    reason xenomorphs are so lethal to armed humans.
  
  composition_notes: |
    Ash's analysis on the Nostromo confirmed the blood is a 'concentrated acid' that 
    could eat through 'every layer' of the ship. The exact chemistry was never fully 
    catalogued before the Nostromo's destruction.

# Exoskeleton and Structure
physiology:
  skeleton:
    type: "Polarized silicon-based endoskeleton with biomechanical exoskeletal elements"
    description: |
      The xenomorph's body blends organic and quasi-mechanical structure — the H.R. Giger 
      'biomechanoid' aesthetic is not merely artistic but reflects the actual physiology. 
      Pipes, ridges, and tubular structures serve biological functions while resembling 
      industrial machinery.
    
    durability: "Extremely high; resistant to most conventional small arms fire"
    weakness: "Extreme heat (flame weapons); explosive decompression; acid erosion"
  
  exoskeleton:
    function:
      - "Armor and structural support"
      - "Camouflage (color and texture matches dark industrial environments)"
      - "Sensory housing for electroreceptors and thermoreceptors"
    
    dorsal_tubes:
      count: 6
      function: "Theorized to be respiratory organs, sensory apparatus, or both"
  
  inner_jaw:
    description: "Secondary pharyngeal jaw on an extendable stalk"
    reach: "Approximately 12-18 inches beyond primary jaw"
    function: "Penetration of hard materials (skulls, visors); precision killing at close range"
    force: "Sufficient to penetrate reinforced glass and bone"
  
  tail:
    structure: "Long, flexible prehensile appendage"
    tip: "Blade-like, hardened tip — can pierce metal"
    uses:
      - "Grappling (wrapping around prey)"
      - "Puncturing (piercing through surfaces)"
      - "Balance during wall/ceiling locomotion"

# Sensory System
sensory_capabilities:
  primary_sense:
    type: "Electroreception"
    description: |
      Xenomorphs detect the electrical fields generated by living nervous systems. 
      This allows them to locate prey through walls, in total darkness, and through 
      materials that would block light or thermal signals. Ash theorized this in the 
      Nostromo medical logs.
    range: "Estimated 20-50 meters through standard bulkheads"
    limitation: "Can be confused by strong electromagnetic interference (theorized)"
  
  thermal_sensing:
    description: "Infrared or thermal sensing; detects body heat"
    role: "Secondary confirmation sensor; used alongside electroreception"
  
  chemical_sensing:
    description: "Pheromone detection; used for hive communication and host tracking"
    role: "Essential for hive coordination; Queen pheromones carry commands to drones"
  
  eyes:
    standard: |
      Standard xenomorphs have no functional eyes in the conventional sense. 
      Skull structures house sensory organs but not light-receptive eyes. 
      They are effectively blind to visible light — rendering darkness irrelevant to them.
    exception: "The Newborn (Alien: Resurrection) has functional eyes — a product of its hybrid human genetics"
  
  hearing:
    evidence: "Xenomorphs appear to respond to sound; likely detect vibration as a tertiary sense"

# Reproductive Biology
reproduction:
  system: "Obligate endoparasitoid — requires a host organism"
  
  queen_production:
    description: |
      Under normal conditions, reproduction requires a Queen. The Queen continuously 
      produces eggs via her ovipositor. Each egg contains one facehugger.
    egg_production_rate: "Several eggs per hour under optimal conditions"
  
  host_requirements:
    viable_hosts:
      - "Any sufficiently complex vertebrate or analogous organism"
      - "Humans (standard warrior form)"
      - "Dogs/Oxen (Runner form)"
      - "Engineers (Deacon variant)"
      - "Predators (Predalien — expanded universe)"
    
    minimum_host_complexity: |
      The host must have a thoracic cavity large enough to contain the developing 
      chestburster and provide adequate tissue nutrition during gestation.
  
  genetic_inheritance:
    mechanism: |
      During gestation, the chestburster embryo absorbs genetic material from the host. 
      This results in host-derived physical adaptations in the adult form. 
      The process is not fully understood but is consistently observed.
    
    examples:
      - host: "Human"
        result: "Standard bipedal warrior; roughly humanoid proportions"
      - host: "Dog or Ox"
        result: "Runner — quadrupedal, faster, more feral"
      - host: "Engineer"
        result: "Deacon — unique skull structure, Engineer proportions"
  
  alternate_reproduction:
    ripley_8_queen: |
      The cloned Ripley 8 carried a Queen embryo whose reproductive system had merged 
      with human biology. The resulting Queen in Alien: Resurrection produced a 'Newborn' 
      through live birth rather than egg/facehugger — a unique event with no other recorded instance.

# Hive Structure
hive:
  organization: "Eusocial; Queen-centric hierarchy"
  
  structure:
    queen: "Reproductive matriarch; tactical commander; pheromone broadcaster"
    warriors: "Active hunting and combat; egg transport; host retrieval"
    drones: "Environmental modification (resin construction); host maintenance; guard duty"
    note: "Caste differentiation may be behavioral rather than genetic"
  
  resin_construction:
    material: |
      Xenomorphs secrete a biological resin used to construct and modify their hive environment. 
      The resin is extremely durable and is used to:
      - Coat and extend existing structures
      - Cocoon hosts for later facehugger implantation
      - Seal off sections of the hive environment
    appearance: "Dark, ribbed, organic-looking material; consistent with Giger's biomechanoid aesthetic"
  
  host_cocooning:
    description: |
      Captured hosts are coated in resin and immobilized against hive walls. 
      They are kept alive for facehugger implantation. The process is typically 
      fatal to the host even before the facehugger attaches — the resin appears 
      to begin biological alteration of the host.
    observed_in: "Alien (Dallas implied); Aliens (colonists cocooned in processing station)"
  
  pheromone_communication:
    description: |
      The Queen's pheromones serve as command and coordination signals across the hive. 
      Individual xenomorphs can also signal threat, prey location, and reproductive status 
      via chemical signals. This functions as a distributed nervous system for the colony.
    range: "Effective across entire hive; degraded by distance and ventilation"
  
  tactical_intelligence:
    examples:
      - "Coordinated ambush of Colonial Marines (Aliens)"
      - "Disabled dropships guidance systems (Aliens)"
      - "Positioned warriors above drop ceiling prior to marines' arrival"
      - "Queen understood hostage situation and negotiated (Aliens — egg chamber)"
      - "Xenomorph on Nostromo adapted stalking strategy after direct confrontations failed"

# Weaknesses
weaknesses:
  confirmed:
    - description: "Fire / extreme heat"
      notes: "Flamethrowers are standard anti-xenomorph weapons; fire appears to cause fear response"
    - description: "Hard vacuum"
      notes: "Xenomorphs can survive brief vacuum exposure but not indefinitely; Ripley uses airlock in Alien"
    - description: "Their own acid blood"
      notes: "Self-inflicted acid wounds are possible; the organism's own defense mechanism can harm it"
    - description: "Explosive decompression"
      notes: "Used by Ripley in multiple films; the Queen in Aliens is ejected via airlock"
  
  possible:
    - description: "Electromagnetic interference"
      notes: "Theorized to disrupt electroreception but never confirmed in film canon"
    - description: "Extreme cold"
      notes: "Dormancy observed in eggs but adult cold vulnerability unconfirmed"

# Origin
origin:
  film_canon_version: |
    Per Alien: Covenant (2017): David 8 engineered the xenomorph using Engineer black goo 
    mutagen on the Engineer homeworld between 2094-2104. The 'classic' xenomorph strain is 
    David's creation — his 'perfect organism.'
  
  earlier_indicators: |
    Prometheus (2012) showed Engineer-derived proto-xenomorphic organisms (Deacon, mutagen effects) 
    predating David's work, suggesting the xenomorph is derived from, or inspired by, pre-existing 
    Engineer bioweapon research rather than invented from scratch by David.
  
  in_universe_corporate_knowledge: |
    Weyland-Yutani were aware of the xenomorph's existence (or potential existence) prior to the 
    Nostromo mission — Special Order 937 was pre-loaded, suggesting prior intelligence about LV-426. 
    The source of this foreknowledge is never fully explained in the films.
