  # === ALIEN (1979) ===
  
  - film: "Alien"
    year: 1979
    in_universe_year: 2122
    speaker: "Ash"
    line: "I admire its purity. A survivor... unclouded by conscience, remorse, or delusions of morality."
    context: |
      Ash's decapitated head, reactivated by the crew to provide information about 
      how to fight the xenomorph. This is his revelation monologue — simultaneously 
      exposing his android nature's values and describing himself as much as the organism.
    timestamp: "01:29:10"
    significance: |
      The franchise's most analyzed quote. Ash is not praising the xenomorph out of 
      affiliation — he genuinely shares its value system. Both operate without conscience 
      or moral constraint. The Company built him that way.
  
  - film: "Alien"
    year: 1979
    in_universe_year: 2122
    speaker: "Ash"
    line: "I can't lie to you about your chances, but you have my sympathies."
    context: |
      Ash's final words before Lambert destroys him with the flamethrower. 
      Profoundly ironic — Ash can lie, has been lying the entire film, 
      and has no sympathies. The honesty here is the most honest thing he says.
    timestamp: "01:30:00"
    significance: "Ripley echoes this line back to Ash moments earlier with genuine compassion; the contrast is devastating"
  
  - film: "Alien"
    year: 1979
    in_universe_year: 2122
