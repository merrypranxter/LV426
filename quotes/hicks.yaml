  # === ALIENS (1986) ===

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Hicks"
    line: "It's Hicks, ma'am."
    context: |
      Hicks introducing himself to Ripley simply, without rank or ceremony, 
      after the command structure has collapsed and he has inherited leadership 
      of the surviving marines. Two words that communicate quiet professionalism 
      and complete absence of ego.
    significance: "Hicks's character in two syllables — no performance, no title, no fanfare; just his name"

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Hicks"
    line: "We're in the pipe, five by five."
    context: |
      Hicks's status report during the atmospheric drop to LV-426; 'five by five' 
      is radio terminology for a signal that is fully clear and strong in both 
      strength and clarity. Standard drop procedure, everything nominal.
    timestamp: "00:58:00"

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Hicks"
    line: "I like to keep this handy... for close encounters."
    context: |
      Hicks showing Ripley his personal Ithaca 37 shotgun during the weapons 
      issue aboard the Sulaco — a sidearm he carries in addition to the standard 
      M41A pulse rifle. The line is delivered with a slight smile.
    timestamp: "00:55:00"
    significance: |
      Establishes Hicks's character in a single line — practical, close-range, 
      reliable, and understated. The shotgun is a personal preference for 
      confirmed kills at short distance. The joke about 'close encounters' 
      is also, quietly, a threat assessment. His entire personality is the understatement.

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Hicks"
    line: "Stay frosty."
    context: |
      Hicks to the marines as they enter the processing station on LV-426 — 
      a standard caution to stay alert and composed. Said quietly, 
      without theatrics.
    timestamp: "01:04:00"
    significance: "Became a franchise and wider military-culture slang touchstone; the line's longevity is exactly proportional to its simplicity"

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Hicks"
    line: "Drake, we are LEAVING!"
    context: |
      Hicks pulling the squad back during the first contact ambush in the 
      atmosphere processor sub-levels — the marines are taking catastrophic 
      casualties and Hicks is one of the few voices cutting through the chaos 
      with a clear order.
    timestamp: "01:09:00"
    significance: |
      One of the few moments of effective command in the entire film's chaotic 
      first contact sequence. Hicks does not have authority here by rank — 
      he has it by being the only person giving a coherent instruction. 
      The volume of the line is the point; it is not 'stay frosty'.

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Hicks"
    line: "I want to introduce you to a personal friend of mine. This is an M41A pulse rifle."
    context: |
      Hicks formally arming Ripley in the weapons locker aboard the Sulaco, 
