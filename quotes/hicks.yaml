    timestamp: "01:22:00"
    significance: "The line marks the moment Ripley transitions from witness to combatant; Hicks extends the trust before she has earned it — and is correct"

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Hicks"
    line: "Four minutes. He means four minutes, Vasquez."
    context: |
      During the final evacuation with the reactor countdown running, Hicks 
      quietly correcting and clarifying the timeline to Vasquez while everyone 
      around him is operating at maximum panic. He has kept count.
    significance: |
      Hicks's defining function in the last act: the quiet voice keeping track 
      of the real numbers while everyone else reacts to the immediate crisis. 
      He is the only one who has been counting.

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Ripley / Hicks"
    line: |
      Ripley: "I say we take off and nuke the entire site from orbit. It's the only way to be sure."
      Hicks: "I could use a little sleep."
    context: |
      After Ripley delivers her famous recommendation to the surviving marines 
      and receives no objection, Hicks adds his response — not a strategic 
      endorsement but a statement of sheer exhaustion and quiet agreement. 
      The 'nuke from orbit' line belongs to Ripley; Hicks's contribution is 
      the understatement that follows.
    note: |
      Frequently misattributed to Hicks alone. The line is Ripley's; Hicks's 
      response is the coda. Both are archived here for completeness and to 
      correct the common misquotation.
