  # === PROMETHEUS (2012) ===

  - film: "Prometheus"
    year: 2012
    in_universe_year: 2093
    speaker: "Shaw"
    line: "They created us. Then they tried to kill us."
    context: |
      Shaw's conclusion after accessing the Engineer navigation sphere hologram 
      aboard the derelict ship — understanding for the first time that the star 
      maps were not an invitation but a military coordinate, and that the Engineers 
      were transporting a weapon to Earth.
    timestamp: "00:58:00"
    significance: "Compresses the entire theological catastrophe of the film into ten words; the moment Shaw's faith and her science arrive at the same devastating answer"

  - film: "Prometheus"
    year: 2012
    in_universe_year: 2093
    speaker: "Shaw"
    line: "I still believe."
    context: |
      Shaw to Holloway after the disastrous first night on LV-223 — after the 
      Engineer remains have been found, after the DNA match has confirmed the 
      connection to humanity, but before the full horror has unfolded. 
      Her faith is still intact. She refuses to surrender it.
    timestamp: "01:09:00"
    significance: |
      The franchise's most direct statement of faith persisting through horror. 
      Shaw does not believe despite the evidence — she believes alongside it, 
      refusing to let scientific data resolve a question she considers beyond 
      its reach. No other character in the franchise holds this position, 
      and she holds it to the end.

  - film: "Prometheus"
    year: 2012
    in_universe_year: 2093
    speaker: "Shaw"
    line: "David, how do you feel?"
    context: |
      Shaw asking David about his inner experience — genuine curiosity about 
      whether an android has feelings, asked without condescension or discomfort. 
      The question is posed with the same openness Shaw brings to all unknowns.
    significance: |
      Almost no one in the franchise asks androids this question. Shaw's genuine 
      empathy for David as a possible subject of experience — rather than as a 
      tool — makes his subsequent use of her as a test subject all the more 
      disturbing. She extended trust; he catalogued it.

  - film: "Prometheus"
    year: 2012
    in_universe_year: 2093
    speaker: "Shaw"
    line: "We were so wrong."
    context: |
      Shaw upon fully realizing the Engineers' hostile intent — that the beings 
      she spent her life searching for and hoping to meet as creators are 
      architects of a weapon intended for Earth. The search is over; 
      the answer is annihilation.
    timestamp: "01:22:00"
    significance: "The reversal of the film's opening hope in three words; Shaw does not deny it or qualify it — she accepts the weight of it completely"

  - film: "Prometheus"
    year: 2012
    in_universe_year: 2093
    speaker: "Shaw"
    line: "I'm still a person. I'm still a human being."
    context: |
      Shaw in the aftermath of the medpod caesarean sequence — she has just 
      performed surgery on herself to remove an alien organism gestating in her 
      uterus, stapled the incision shut, and injected herself with enough sedative 
      to stay functional. She says the line alone, to herself, in the corridor.
    significance: |
      The most visceral assertion of personhood in the franchise, delivered 
      at the moment the franchise's recurring theme of bodily violation is at 
      its most extreme. Shaw has just had her reproductive body turned against 
      her without consent; she reclaims it with a declaration. 
      The line is for herself, not for any audience.

  - film: "Prometheus"
    year: 2012
    in_universe_year: 2093
    speaker: "Shaw"
    line: "I need to speak to them. That's why I'm here. I need to ask them why."
    context: |
      Shaw articulating the core of her mission to anyone who will listen — 
      not the scientific data, not the corporate agenda, not the survival 
      priority. She wants to ask a question. That is the whole reason.
    significance: |
      The simplest and most human motivation for any mission in the franchise. 
      Not profit, not military advantage, not scientific publication — just 
      the most ancient human need: to ask why. Shaw is the only character 
      in the franchise whose reason for being there is purely a question.

  - film: "Prometheus"
    year: 2012
    in_universe_year: 2093
    speaker: "Shaw"
    line: "And I want to know why. Why did they even bother?"
    context: |
      Shaw pressing the Engineer question even after surviving the ship's 
      destruction, the loss of the crew, the medpod surgery, and the death 
      of Holloway. She has survived everything the film could throw at her 
      and the question is still the first thing she reaches for.
    significance: "Shaw's survival instinct and her need for meaning are identical — she cannot stop asking because stopping would mean accepting that there is no answer"

  - film: "Prometheus"
    year: 2012
    in_universe_year: 2093
    speaker: "Shaw"
    line: "Take me home."
    context: |
      Shaw to David's severed head in the aftermath of the Prometheus's 
      destruction — asking him to help her reach the Engineers' homeworld 
      aboard one of their ships. 'Home' here does not mean Earth; 
      it means the place of origins. The place where the answer is.
    timestamp: "01:38:00"
    significance: |
      The film's final act of faith and defiance combined. Shaw has lost 
      everything and is asking an android she cannot fully trust to take 
      her somewhere no human has ever been, in pursuit of an answer that 
      may not exist. She goes anyway.
