  # === ALIENS (1986) ===

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Newt"
    line: "They mostly come at night... mostly."
    context: |
      Newt describing xenomorph behavior patterns to the marines — when the 
      creatures are most active in the colony. She pauses before the second 
      'mostly'. It is not a verbal tic. It is precision: she knows there are 
      exceptions, and she will not overstate what she knows.
    timestamp: "00:50:00"
    significance: |
      The franchise's most unexpectedly philosophical line from a child. 
      The first 'mostly' is information; the second is epistemological honesty 
      from someone who has survived by knowing exactly what she does and does not 
      know. The pause before the second word is everything. Henn's delivery 
      makes it timeless: a child scientist reporting field data. 
      Became a franchise icon precisely because it is both comic and completely serious.

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Newt"
    line: "My mommy always said there were no monsters — no real ones — but there are."
    context: |
      Newt to Ripley, quietly, in the medical bay — the first time she has 
      spoken at length since being found. She is not crying. She is reporting 
      a fact she has personally verified.
    timestamp: "00:51:00"
    significance: |
      The clearest statement of what the film has done to childhood. Every horror 
      film operates on this premise implicitly — that the reassurances adults give 
      children are lies, that the dark does contain things. Newt makes it explicit, 
      and she makes it hurt because she is the only character in the franchise 
      young enough to have once believed the reassurance.

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Newt"
    line: "It won't make any difference."
    context: |
      Newt's flat response when the marines attempt to reassure her that 
      they have the situation under control and that she is safe now. 
      She has seen what they have not yet seen. She is not being pessimistic; 
      she is correct.
    significance: |
      Newt is the franchise's most credible field expert and the least listened-to 
      character in the film. She has survived alone in a xenomorph-occupied colony 
      for weeks. The marines have been on the ground for hours. 
      She knows more. No one acts on it.

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Newt"
    line: "Nobody ever believed me."
    context: |
      Newt referring to her early warnings — to other survivors, to the colony 
      adults, to anyone who might have acted before the situation became 
      unsurvivable. No one did. They are all dead.
    significance: |
      Newt is the franchise's most credible expert and the least listened to. 
      A child who survived a xenomorph hive alone has more operational 
      intelligence than any of the marines who arrive. The adults' failure 
      to listen is not incidental to the film's disaster — it is causal.

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Newt"
    line: "Ripley... don't go... please."
    context: |
      Newt grabbing Ripley's arm before Ripley leaves the group to retrieve 
      the drop ship remote — a near-suicidal run through xenomorph-held 
      territory. Newt has watched every adult who left her not come back.
    timestamp: "01:44:00"
    significance: |
      The deepest fear made audible. Newt does not say 'it's dangerous' 
      or 'you might die' — she says please. She has pattern-matched: 
      people who leave her do not return. Ripley is the first exception. 
      Newt does not yet know that.

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Ripley / Newt"
    line: |
      Ripley: "Are you afraid?"
      Newt: "Yes."
    context: |
      Exchange between Ripley and Newt before the final escape sequence — 
      Ripley asking the question honestly, Newt answering without performance. 
      Neither of them pretends. It is the most direct conversation in the film.
    significance: |
      Simple, mutual honesty between a child and an adult at the worst possible 
      moment. The franchise's recurring response to terror is either bravado 
      or suppression; this exchange is neither. Two people telling each other 
      the truth because there is no longer any reason not to.

  - film: "Aliens"
    year: 1986
    in_universe_year: 2179
    speaker: "Newt"
    line: "I knew you'd come."
    context: |
      Newt to Ripley after being rescued from the xenomorph hive — weak, 
      traumatized, partially submerged in a resin cocoon. She says it 
      without surprise. She had decided to believe it, and she was right.
    timestamp: "01:50:00"
    significance: |
      The payoff of the surrogate mother relationship — and the film's most 
      earned emotional beat. Newt extended trust to someone she had known 
      for hours, in a situation where every adult had failed her. 
      Her trust was correct. The line is not relief; it is confirmation of 
      something she chose to believe against all available evidence. 
      It is the franchise's most quietly devastating act of faith.
