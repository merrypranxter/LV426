---
name: "Cryogenic Hypersleep"
designation: "Hypersleep / Cryogenic Stasis System"
category: "Life support / space travel technology"
first_appearance: "Alien (1979)"

description: |
  Hypersleep is a cryogenic stasis process used aboard interstellar vessels for 
  long-duration spaceflight. Crew members are placed in individual hypersleep 
  chambers where their metabolic processes are slowed to near-zero, suspending 
  aging and biological function for the duration of transit. The process requires 
  a supervised wake cycle with associated physical and cognitive recovery time.

  Hypersleep is not perfect stasis — subjects can experience nightmares during the 
  suspension period (as shown with Ripley's repeated xenomorph nightmares), and 
  extended hypersleep causes documented psychological effects on awakening. The 
  technology is standard on all deep-space commercial and military vessels in the 
  franchise.

specifications:
