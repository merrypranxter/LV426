---
name: "M41A Pulse Rifle"
designation: "M41A Pulse Rifle"
manufacturer: "Armat Battlefield Systems"
category: "Infantry weapon / assault rifle"
first_appearance: "Aliens (1986)"

description: |
  The M41A Pulse Rifle is the standard infantry weapon of the United States Colonial 
  Marine Corps. Chambered in 10x24mm caseless ammunition with a 99-round magazine, 
  it combines an assault rifle with an integrated 30mm pump-action grenade launcher 
  underslung beneath the barrel. The weapon includes an ammunition counter — a 
  digital readout displaying rounds remaining — that becomes the film's most 
  insistent countdown device.

  The rifle fires from a closed bolt in fully automatic mode. The characteristic 
  sound — a rapid, metallic chattering distinct from contemporary firearms — was 
  engineered by James Cameron and the sound design team for Aliens and became one 
  of cinema's most recognisable weapon sounds.

