    film: "Aliens (1986)"
    fate: "Weapon eventually abandoned when Vasquez and Gorman sacrifice themselves with a grenade"
  - name: "Drake"
    film: "Aliens (1986)"
    fate: "Drake is killed during the initial contact engagement; his smart gun lost"

thematic_role:
  - "The smart gun represents the military's answer to the xenomorph — more firepower, smarter targeting — and it is still not enough"
  - "Vasquez's ownership of the smart gun is the film's most direct visual statement about competence over gender norms"
  - "Like the pulse rifle, the smart gun is neutralized not by inadequacy but by the tactical environment: reactor rooms where discharge is fatal, dark hive spaces where IFF fails"

