---
name: "M56 Smart Gun"
designation: "M56 Smart Gun System"
manufacturer: "Armat Battlefield Systems"
category: "Infantry weapon / support weapon"
first_appearance: "Aliens (1986)"

description: |
  The M56 Smart Gun is a gyroscopically stabilized automatic weapon mounted on a 
  body harness with an articulated arm, paired with a head-mounted infrared tracking 
  system (IIR). The weapon's onboard targeting system tracks the operator's line of 
  sight and can slave the gun to track identified heat signatures automatically — 
  the "smart" element that gives the system its name.

  The M56 is a crew-served weapon in practice, requiring a dedicated operator who 
  carries the mounting harness and weapon. Its rate of fire significantly exceeds 
  the M41A pulse rifle. In Aliens, the smart guns are operated by Vasquez and Drake 
  — the unit's two most aggressive soldiers.

specifications:
  caliber: "10mm"
  rate_of_fire: "~1200 rounds per minute"
  feed_system: "Belt-fed from body-worn drum magazine"
  tracking_system: "Head-mounted IIR (Infrared Imaging and Ranging)"
  stabilization: "Gyroscopic, articulated mounting arm"
  operator_interface: "HMD (Helmet-Mounted Display) targeting"

operators:
