description: |
  The P-5000 Powered Work Loader is a full-body hydraulic exoskeleton designed for 
  heavy industrial operations — loading ordnance, moving equipment, and handling 
  cargo beyond unaided human capacity. In standard operation, it functions as an 
  amplified tool for dock workers and weapons technicians. On the USS Sulaco and at 
  Hadley's Hope, units were used for ordnance loading and freight management.

  The loader operates by amplifying the pilot's own movements, translating human 
  motion into hydraulic force capable of lifting approximately two metric tons. The 
  pilot is fully enclosed in the frame, which provides a degree of physical protection 
  from impact, though the design is industrial rather than combat-rated.

