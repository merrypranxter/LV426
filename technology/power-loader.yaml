iconic_use:
  film: "Aliens (1986)"
  timestamp: "01:54:00"
  scene: |
    After Newt is recovered and the survivors have reached the Sulaco landing bay, 
    the Alien Queen — who stowed away on the dropship — tears Bishop apart and 
    corners Newt. Ripley dons the power loader, steps forward, and delivers the 
    franchise's most iconic line: "Get away from her, you BITCH!" The fight that 
    follows — industrial machine versus evolved apex predator — is the film's 
    definitive cathartic release. Ripley jettisons the Queen into space.
  significance: |
    The power loader sequence is the franchise's most imitated action beat. It 
    recasts the technology of labour — a tool built to move cargo — as a weapon of 
    maternal defense. Ripley's use of an industrial exoskeleton rather than purpose-
    built military hardware underscores the franchise's working-class aesthetic: the 
    tools of labour are also the tools of survival.

